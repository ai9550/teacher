    body {

      position: relative;
    }

    /* Home Navigation Button */
    .home-btn {
      position: fixed;
      top: 15px;
      right: 15px;
      background: rgba(30, 41, 59, 0.75);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 2px solid rgba(255, 255, 255, 0.8);
      color: #ffffff !important;
      padding: 9px 18px;
      border-radius: 25px;
      text-decoration: none;
      font-weight: 900;
      font-size: 1rem;
      transition: all 0.25s ease;
      z-index: 99999;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.25);
      user-select: none;
    }
    .home-btn:hover {
      background: rgba(15, 23, 42, 0.95);
      border-color: #ffffff;
      transform: translateY(-2px) scale(1.04);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
    }

    .card {
      transition: all 0.25s ease;
      cursor: pointer;
      aspect-ratio: 1;
      user-select: none;
    }

    .card:hover {
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 10px 25px rgba(0,0,0,0.18);
    }

    .card-content {
      transition: opacity 0.2s ease;
    }

    .animal-emoji {
      font-size: clamp(2.5rem, 6vw, 4rem);
    }

    /* 賓果連線的紅線樣式 */
    .bingo-line {
      position: absolute;
      background-color: #ef4444;
      z-index: 20;
      border-radius: 9999px;
      box-shadow: 0 0 12px rgba(239, 68, 68, 0.85);
      transition: opacity 0.4s ease;
      pointer-events: none;
    }

    /* 萬用格 (PASS) 專屬樣式 */
    .pass-card {
      box-shadow: 0 0 20px rgba(245, 158, 11, 0.8), 0 0 10px rgba(0,0,0,0.15) !important;
      transform: scale(1.03);
    }

    /* 訊息框樣式 */
    #messageBox {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    #messageBox.active {
      opacity: 1;
      pointer-events: auto;
    }

    /* 彩帶（Confetti）效果容器 */
    #confettiContainer {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      overflow: hidden;
      z-index: 50;
      opacity: 0;
      transition: opacity 0.5s;
    }

    .confetti {
      position: absolute;
      width: 8px;
      height: 8px;
      background-color: transparent;
      border-radius: 50%;
      animation: confetti-fall 3s ease-in-out forwards;
      opacity: 0.85;
      transform-origin: center;
    }

    @keyframes confetti-fall {
      0% { transform: translate(var(--startX), -5vh) rotate(0deg); opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { transform: translate(var(--endX), 105vh) rotate(720deg); opacity: 0; }
    }

      font-size: clamp(0.7rem, 1.8vw, 0.95rem) !important;
      line-height: 1.25;
      overflow-wrap: break-word;
      word-break: break-word;
      font-weight: 600;
    }

    .term-text {
      font-size: clamp(1.2rem, 3.2vw, 2.2rem);
      font-weight: 900;
      font-family: '標楷體', 'DFKai-SB', serif;
      line-height: 1.15;
    }

      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.5rem;
    }
    @media (min-width: 1024px) {
      #lessonButtons {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }
    }

      transition: all 0.2s ease;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      font-size: 0.92rem;
      text-align: left;
      line-height: 1.3;

    .lesson-btn.active {

      color: white;
      box-shadow: 0 4px 15px rgba(219, 39, 119, 0.4);

</head>

    const CARD_COUNT = 16;
    const LESSON_EMOJIS = [
      "🍎", "🍊", "🍋", "🥝", "🍉", "🍇", "🍓", "🍒", 
      "🍍", "🍑", "🥭", "🥥", "🥑", "🥕", "🥦", "🍄",

    ];
    
    let currentLesson = 1;
    let vocabulary = [];
    let cardStates = [];
    let markedCards = [];

    // 音效合成
    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function playSound(type) {
      try {
        if (!audioCtx && AudioContextClass) {
          audioCtx = new AudioContextClass();
        }
        if (audioCtx && audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        if (!audioCtx) return;

        const now = audioCtx.currentTime;
        if (type === 'click') {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(600, now);
          osc.frequency.exponentialRampToValueAtTime(300, now + 0.08);
          gain.gain.setValueAtTime(0.25, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now);
          osc.stop(now + 0.08);
        } else if (type === 'win') {
          const notes = [523.25, 659.25, 783.99, 1046.50];
          notes.forEach((freq, idx) => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, now + idx * 0.09);
            gain.gain.setValueAtTime(0.25, now + idx * 0.09);
            gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.09 + 0.4);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now + idx * 0.09);
            osc.stop(now + idx * 0.09 + 0.4);
          });
        }
      } catch(e) {}
    }

    function speakText(text) {
      if ('speechSynthesis' in window) {
        try {
          window.speechSynthesis.cancel();
          const utterance = new SpeechSynthesisUtterance(text);
          utterance.lang = 'zh-TW';
          utterance.rate = 0.85;
          window.speechSynthesis.speak(utterance);
        } catch(e) {}
      }
    }

    function shuffleArray(array) {
      const shuffled = [...array];
      for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
      }
      return shuffled;
    }

    function showConfetti() {

      if (!container) return;
      
      container.innerHTML = ''; 
      container.style.opacity = '1';
      
      const colors = ['#f43f5e', '#6366f1', '#10b981', '#f59e0b', '#3b82f6', '#ec4899', '#8b5cf6'];

        const endX = Math.random() * 100 + 'vw';

      }

      setTimeout(() => {

    function drawBingoLines(lines) {
      const overlay = document.getElementById('bingoOverlay');
      if (!overlay) return;

      overlay.innerHTML = '';

      const grid = document.getElementById('bingoGrid');
      if (!grid) return;
      const gridRect = grid.getBoundingClientRect();
      
      const cardElements = Array.from(grid.children);
      
      lines.forEach(indices => {
        const startCard = cardElements[indices[0]];
        const endCard = cardElements[indices[indices.length - 1]];

        if (!startCard || !endCard) return;

        const startRect = startCard.getBoundingClientRect();
        const endRect = endCard.getBoundingClientRect();

        const startX = startRect.left + startRect.width / 2 - gridRect.left;
        const startY = startRect.top + startRect.height / 2 - gridRect.top;
        const endX = endRect.left + endRect.width / 2 - gridRect.left;
        const endY = endRect.top + endRect.height / 2 - gridRect.top;

        const dx = endX - startX;
        const dy = endY - startY;
        const length = Math.sqrt(dx * dx + dy * dy);
        const angle = Math.atan2(dy, dx) * 180 / Math.PI;

        const line = document.createElement('div');
        line.className = 'bingo-line';
        line.style.left = `${startX}px`;
        line.style.top = `${startY}px`;
        line.style.width = `${length}px`;
        line.style.height = '8px'; 
        line.style.transformOrigin = '0 0'; 
        line.style.transform = `rotate(${angle}deg)`;

        overlay.appendChild(line);
      });
    }

    function checkForBingo() {
      const size = 4;
      const lines = [];
      
      function addLine(indices) {
        if (indices.every(i => markedCards[i])) {
          lines.push(indices);
        }
      }

      // Rows
      for (let i = 0; i < size; i++) {
        const rowIndices = [];
        for (let j = 0; j < size; j++) {
          rowIndices.push(i * size + j);
        }
        addLine(rowIndices);
      }

      // Columns
      for (let j = 0; j < size; j++) {
        const colIndices = [];
        for (let i = 0; i < size; i++) {
          colIndices.push(i * size + j);
        }
        addLine(colIndices);
      }

      // Diagonals
      const diag1Indices = [];
      for (let i = 0; i < size; i++) {
        diag1Indices.push(i * size + i);
      }
      addLine(diag1Indices);

      const diag2Indices = [];
      for (let i = 0; i < size; i++) {
        diag2Indices.push(i * size + (size - 1 - i));
      }
      addLine(diag2Indices);

      if (lines.length > 0) {
        playSound('win');
        showMessage("賓果！", `恭喜您達成 ${lines.length} 條連線！`);
        drawBingoLines(lines);
        showConfetti();
      } else {
        document.getElementById('bingoOverlay').innerHTML = '';
      }
    }
    
    function formatTextIn6x4(text) {
      const chars = [];
      const charsPerLine = 6; 
      
      for (let i = 0; i < text.length; i++) {
        const char = text[i];
        chars.push(char);
        
        const isEndOfChunk = (i + 1) % charsPerLine === 0;
        const hasMoreChars = i < text.length - 1;
        
        if (isEndOfChunk && hasMoreChars) {
          const remainingChars = text.length - (i + 1);
          if (remainingChars > 2) { 
            chars.push('<br>');
          }
        }
      }
      return chars.join('');
    }

    function updateCardContent(index) {
      const content = document.getElementById(`card-${index}`);
      const item = vocabulary[index];
      const state = cardStates[index];
      
      content.parentElement.classList.remove('pass-card');
      
      if (state === 0) {
        // 圖案狀態
        content.innerHTML = `<div class="animal-emoji">${item.animal}</div>`;
        content.parentElement.className = 'card bg-gradient-to-br from-amber-50 to-orange-100 rounded-2xl shadow-md p-3 flex items-center justify-center border-2 border-amber-200';
      } else if (state === 1) {
        // 解釋狀態
        const formattedText = formatTextIn6x4(item.definition); 
        content.innerHTML = `<div class="definition-text text-slate-800 px-1 text-center">${formattedText}</div>`;
        content.parentElement.className = 'card bg-gradient-to-br from-sky-50 to-blue-100 rounded-2xl shadow-md p-3 flex items-center justify-center border-2 border-blue-200';
      } else {
        // 語詞狀態 (標記)
        let termText = item.term;
        if (item.term === "PASS") {
          termText = "⭐ PASS"; 
          content.parentElement.classList.add('pass-card'); 
        }

        content.innerHTML = `<div class="term-text text-emerald-950">${termText}</div>`;
        content.parentElement.className = 'card bg-gradient-to-br from-emerald-100 to-teal-100 rounded-2xl shadow-md p-3 flex items-center justify-center border-2 border-emerald-300';
      }
    }

    function toggleCard(index) {
      playSound('click');
      const isPassCard = vocabulary[index].term === "PASS";
      
      if (isPassCard) {
        if (cardStates[index] === 0) {
          cardStates[index] = 2;
        } else {
          cardStates[index] = 0;
        }
      } else {
        cardStates[index] = (cardStates[index] + 1) % 3;
      }

      updateCardContent(index);

      if (cardStates[index] === 2 && !isPassCard) {
        speakText(vocabulary[index].term);
      }

      markedCards[index] = cardStates[index] === 2;
      checkForBingo();
    }

    function initializeGame() {
      const grid = document.getElementById('bingoGrid');
      grid.innerHTML = ''; 
      
      document.getElementById('bingoOverlay').innerHTML = '';
      const confettiContainer = document.getElementById('confettiContainer');
      if (confettiContainer) {
        confettiContainer.style.opacity = '0';
        confettiContainer.innerHTML = '';
      }

      vocabulary.forEach((item, index) => {
        const card = document.createElement('div');
        card.className = 'card bg-white rounded-2xl shadow-md p-3 flex items-center justify-center border-2 border-slate-200';
        card.onclick = () => toggleCard(index);
        
        const content = document.createElement('div');
        content.className = 'card-content text-center w-full h-full flex items-center justify-center';
        content.id = `card-${index}`;
        
        card.appendChild(content);
        grid.appendChild(card);
        
        updateCardContent(index);
      });
      
      document.getElementById('messageBox')?.classList.remove('active'); 
    }
    
    function loadLesson(lessonNumber) {
      currentLesson = lessonNumber;
      const lesson = allLessonData[lessonNumber];
      if (!lesson) return;

      document.getElementById('gameTitle').textContent = `康軒國語四上語詞賓果遊戲4x4 - ${lesson.title}`;

      let currentVocab = [...lesson.vocab];
      
      // 填充 PASS 卡片至 16 格
      const passNeeded = CARD_COUNT - currentVocab.length;
      if (passNeeded > 0) {
        for (let i = 0; i < passNeeded; i++) {
          currentVocab.push({ 
            term: "PASS", 
            definition: "萬用格，點擊即可翻開標記。", 
            isPass: true 
          });
        }
      } else if (currentVocab.length > CARD_COUNT) {
        // 若大於 16 詞，隨機取 16 詞
        currentVocab = shuffleArray(currentVocab).slice(0, CARD_COUNT);
      }
      
      vocabulary = shuffleArray(currentVocab);
      
      const shuffledEmojis = shuffleArray(LESSON_EMOJIS);
      vocabulary.forEach((item, index) => {
        if (!item.isPass) {
          item.animal = shuffledEmojis[index % shuffledEmojis.length]; 
        } else {
          item.animal = "⭐";
        }
      });
      
      cardStates = new Array(vocabulary.length).fill(0);
      markedCards = new Array(vocabulary.length).fill(false);
      
      initializeGame();
      updateButtonStates(lessonNumber);
    }

    function createLessonButtons() {
      const container = document.getElementById('lessonButtons');
      container.innerHTML = '';
      const lessonKeys = Object.keys(allLessonData).map(Number).sort((a, b) => a - b);
      
      lessonKeys.forEach(key => {
        const button = document.createElement('button');
        button.textContent = allLessonData[key].title;
        button.className = 'lesson-btn';
        button.id = `btn-lesson-${key}`;
        button.onclick = () => loadLesson(key);
        container.appendChild(button);
      });
    }
    
    function updateButtonStates(activeLesson) {
      const buttons = document.querySelectorAll('.lesson-btn');
      buttons.forEach(btn => {
        const lessonNumber = parseInt(btn.id.replace('btn-lesson-', ''), 10);
        if (lessonNumber === activeLesson) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      });
    }
    
    document.addEventListener('DOMContentLoaded', () => {
      createLessonButtons();
      loadLesson(1);

      const resetButton = document.getElementById('resetButton');
      if (resetButton) {
        resetButton.addEventListener('click', () => {
          loadLesson(currentLesson);
        });
      }
      
      window.addEventListener('resize', () => {
        document.getElementById('bingoOverlay').innerHTML = '';
      });
    });
  </script>
</body>
</html>
