<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#120c2b">
  <title>除法夜戰：月光城堡</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;color:#fff;background:#100b25}
    body{background:radial-gradient(ellipse at 50% 0,#453078 0,#17102e 52%,#090713 100%);padding:24px}
    header{max-width:1180px;margin:0 auto 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
    .header-right{display:flex;align-items:center;gap:12px}
    .qr-card{display:flex;align-items:center;gap:8px;padding:6px 10px 6px 6px;border-radius:12px;background:rgba(255,255,255,.96);border:2px solid #d7aaff;color:#1e1638;cursor:zoom-in;box-shadow:0 4px 16px #8b4dff55;transition:transform .15s ease}
    .qr-card:hover{transform:translateY(-2px)}
    .qr-card img{width:64px;height:64px;display:block;border-radius:6px;background:#fff;image-rendering:pixelated}
    .qr-card .qr-text{font-size:12px;font-weight:700;line-height:1.35;text-align:left}
    .qr-card .qr-sub{font-size:11px;font-weight:500;color:#5b4b8a;display:block}
    #page-qr-modal{display:none;position:fixed;inset:0;z-index:10000;background:rgba(10,6,24,.78);backdrop-filter:blur(4px);align-items:center;justify-content:center;padding:20px}
    #page-qr-modal.open{display:flex}
    #page-qr-modal .modal-card{background:#fff;color:#1e1638;border-radius:22px;padding:24px 28px;box-shadow:0 24px 60px rgba(0,0,0,.45);display:flex;flex-direction:column;align-items:center;gap:12px;max-width:92vw;text-align:center}
    #page-qr-modal .modal-title{font-size:20px;font-weight:800}
    #page-qr-modal img{width:min(280px,70vw);height:min(280px,70vw);display:block;border-radius:12px;border:2px solid #e2d8f8;background:#fff;image-rendering:pixelated}
    #page-qr-modal .modal-hint{font-size:13px;color:#5b4b8a}
    #page-qr-modal .modal-close{margin-top:4px;padding:8px 24px;border:none;border-radius:999px;background:#533590;color:#fff;font-size:15px;font-weight:700;cursor:pointer}
    h1{font-size:clamp(20px,3vw,32px);margin:0;text-shadow:0 0 18px #c47aff}.back,.start{display:inline-block;text-decoration:none;color:#fff;font-weight:800;border:1px solid #d7aaff;border-radius:999px;padding:10px 18px;background:#533590;box-shadow:0 0 20px #8b4dff55}
    .frame{max-width:1180px;margin:auto;border:2px solid #b786ff;border-radius:20px;overflow:hidden;box-shadow:0 0 60px #814dff55;background:#000}
    iframe{display:block;width:100%;height:min(76vh,760px);min-height:460px;border:0;background:#000}
    footer{max-width:1180px;margin:14px auto;color:#d9c8f7;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:14px}
    @media(max-width:600px){body{padding:12px}.frame{border-radius:12px}iframe{height:72vh;min-height:400px}header{align-items:center}.qr-card img{width:52px;height:52px}}
  </style>
</head>
<body>
  <header>
    <h1>🦇 除法夜戰：月光城堡</h1>
    <div class="header-right">
      <a class="back" href="./">返回遊戲大廳</a>
      <div class="qr-card" id="page-qr-widget" title="點我放大 QR Code">
        <img id="page-qr-img" alt="本頁 QR Code">
        <div class="qr-text">📱 平板掃碼玩<span class="qr-sub">點我放大</span></div>
      </div>
    </div>
  </header>
  <main class="frame"><iframe src="./division-night-v2/index.html" title="除法夜戰：月光城堡" allow="autoplay; fullscreen; gamepad" allowfullscreen></iframe></main>
  <footer><span>答對除法題目即可升級武器，挑戰每 30 秒登場的大魔王！</span><a class="start" href="./division-night-v2/index.html">全螢幕遊玩 ↗</a></footer>
  <div id="page-qr-modal">
    <div class="modal-card">
      <div class="modal-title">📱 用平板掃描立即開始</div>
      <img id="page-qr-modal-img" alt="本頁放大 QR Code">
      <div class="modal-hint" id="page-qr-modal-hint"></div>
      <button type="button" class="modal-close" id="page-qr-modal-close">關閉</button>
    </div>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
  <script id="page-qr-script">
  (function () {
    function getPageUrl() {
      try { var u = new URL(window.location.href); u.hash = ''; return u.href; }
      catch (e) { return window.location.href; }
    }
    function buildQrSrc(url, cellSize) {
      try {
        if (typeof window.qrcode === 'function') {
          var qr = window.qrcode(0, 'M');
          qr.addData(url);
          qr.make();
          return qr.createDataURL(cellSize || 6, 4);
        }
      } catch (e) {}
      return 'https://api.qrserver.com/v1/create-qr-code/?size=280x280&margin=10&data=' + encodeURIComponent(url);
    }
    var url = getPageUrl();
    document.getElementById('page-qr-img').src = buildQrSrc(url, 6);
    document.getElementById('page-qr-modal-img').src = buildQrSrc(url, 10);
    document.getElementById('page-qr-modal-hint').textContent = document.title || '除法夜戰：月光城堡';
    var modal = document.getElementById('page-qr-modal');
    document.getElementById('page-qr-widget').addEventListener('click', function () { modal.classList.add('open'); });
    modal.addEventListener('click', function (e) {
      if (e.target === modal || e.target.id === 'page-qr-modal-close') modal.classList.remove('open');
    });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') modal.classList.remove('open'); });
  })();
  </script>
</body>
</html>
