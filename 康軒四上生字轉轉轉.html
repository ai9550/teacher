      font-weight: 700;

      user-select: none;
      font-family: 'Noto Sans TC', sans-serif;

    .lesson-btn:hover {

      border: 2px solid #ffffff;

    .game-container {
      max-width: 820px;
      width: 100%;
      background: rgba(255, 255, 255, 0.96);
      border-radius: 24px;
      padding: 30px 35px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.6);
      text-align: center;
    }

    .header {
      margin-bottom: 20px;
    }

    .title {
      font-family: 'ZCOOL KuaiLe', 'Noto Sans TC', sans-serif;
      font-size: 2.3rem;
      color: #2d3748;
      margin-bottom: 12px;

      border-radius: 14px;
      font-size: 1.1rem;
      font-weight: 700;
      color: #1e293b;
      border: 2px solid #cbd5e1;
      display: inline-block;
      max-width: 95%;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
      transition: all 0.3s ease;
    }

    .stage-info.stage-0 {
      background: linear-gradient(135deg, #eff6ff, #dbeafe);
      border-color: #93c5fd;
      color: #1e40af;
    }

      border-color: #fde047;
      color: #854d0e;
    }
    .stage-info.stage-2 {
      background: linear-gradient(135deg, #f0fdf4, #bbf7d0);
      border-color: #86efac;
      color: #166534;
    }
    .stage-info.stage-3 {
      background: linear-gradient(135deg, #fdf2f8, #fbcfe8);
      border-color: #f472b6;
      color: #9d174d;
    }

      background: #f8fafc;
      border-radius: 20px;
      padding: 30px 20px;
      margin: 22px 0;
      min-height: 270px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 25px;
      flex-wrap: wrap;
      position: relative;
      border: 3px dashed #cbd5e1;
      box-shadow: inset 0 2px 10px rgba(0,0,0,0.04);
      overflow: hidden;
    }

    .component-card {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 105px;
      min-height: 105px;
      padding: 12px 18px;
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.12);
      border: 3px solid #93c5fd;
      font-size: 3.8rem;
      font-weight: 900;
      color: #1e40af;
      font-family: '標楷體', 'DFKai-SB', 'BiauKai', serif;
      cursor: pointer;
      user-select: none;
      transition: transform 0.3s ease, color 0.2s ease, border-color 0.2s ease;
      white-space: pre-line;
      line-height: 1.05;
    }

    .component-card:hover {
      transform: scale(1.08);
      border-color: #3b82f6;
      color: #1d4ed8;
      box-shadow: 0 12px 28px rgba(37, 99, 235, 0.25);
    }

    .component-card.merged {
      background: linear-gradient(135deg, #fef3c7, #fde68a);
      border-color: #f59e0b;
      color: #b45309;
      box-shadow: 0 10px 25px rgba(245, 158, 11, 0.3);
      animation: pulseMerge 0.5s ease-out;
    }

    @keyframes pulseMerge {
      0% { transform: scale(0.7); opacity: 0.5; }
      50% { transform: scale(1.15); }
      100% { transform: scale(1); opacity: 1; }
    }

    /* 旋轉動畫 */
    .rotating {
      animation: rotateAnim 3.5s linear infinite;
    }

    @keyframes rotateAnim {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .answer-display {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      animation: celebratePop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes celebratePop {
      0% { transform: scale(0.5); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

      font-size: 7.5rem;
      font-weight: 900;
      color: #15803d;
      font-family: '標楷體', 'DFKai-SB', 'BiauKai', serif;

      color: white;
    }
    .btn-nav:hover:not(:disabled) {

      color: #64748b;
      font-weight: 600;

        padding: 8px 12px;

      .answer-char {

      }
      .answer-desc {

    let currentLessonKey = "1";
    let questions = lessonsData[currentLessonKey].questions;
    let currentIndex = 0;
    let currentStage = 0; 
    // 0: 初始旋轉
    // 1: 停止旋轉
    // 2: 合併部分部件
    // 3: 揭曉完整答案

    // Web Audio 音效產生器
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playTone(freq, type = 'sine', duration = 0.15, gainVal = 0.1) {
      try {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(gainVal, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    function playHintSound(stage) {
      if (stage === 1) {
        playTone(440, 'triangle', 0.18, 0.12);
        setTimeout(() => playTone(554.37, 'triangle', 0.18, 0.12), 80);
      } else if (stage === 2) {
        playTone(523.25, 'sine', 0.15, 0.15);
        setTimeout(() => playTone(659.25, 'sine', 0.15, 0.15), 90);
        setTimeout(() => playTone(783.99, 'sine', 0.2, 0.15), 180);
      } else if (stage === 3) {
        playTone(523.25, 'triangle', 0.12, 0.15);
        setTimeout(() => playTone(659.25, 'triangle', 0.12, 0.15), 100);
        setTimeout(() => playTone(783.99, 'triangle', 0.12, 0.15), 200);
        setTimeout(() => playTone(1046.5, 'triangle', 0.35, 0.18), 300);
      }
    }

    // 語音朗讀生字與詞語
    function speakWord(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'zh-TW';
        utterance.rate = 0.88;
        window.speechSynthesis.speak(utterance);
      }
    }

    // 切換課程
    function switchLesson(key) {
      if (!lessonsData[key]) return;
      currentLessonKey = key;
      questions = lessonsData[key].questions;
      currentIndex = 0;
      currentStage = 0;

      // 更新側邊欄按鈕狀態
      document.querySelectorAll('.lesson-btn').forEach(btn => {
        if (btn.getAttribute('data-lesson') === key) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      });

      // 更新主標題
      const lessonTitle = lessonsData[key].name;
      document.getElementById('mainTitle').textContent = `🧩 ${lessonTitle} 生字轉轉轉`;

      renderCurrentState();
    }

    // 渲染當前狀態
    function renderCurrentState() {
      const q = questions[currentIndex];
      const stageInfoEl = document.getElementById('stageInfo');
      const gameAreaEl = document.getElementById('gameArea');
      const hintBtn = document.getElementById('hintBtn');
      const prevBtn = document.getElementById('prevBtn');
      const nextBtn = document.getElementById('nextBtn');
      const counterEl = document.getElementById('questionCounter');

      counterEl.textContent = `第 ${currentIndex + 1} 題 / 共 ${questions.length} 題`;
      prevBtn.disabled = currentIndex === 0;

      // 提示狀態列與按鈕文字設定
      stageInfoEl.className = 'stage-info stage-' + currentStage;
      hintBtn.disabled = false;

      if (currentStage === 0) {
        stageInfoEl.textContent = '初始狀態：部件正在旋轉中，觀察散落的部件，猜猜看是什麼字？';
        hintBtn.innerHTML = '💡 提示 1 (停止旋轉)';
      } else if (currentStage === 1) {
        stageInfoEl.textContent = '提示 1：部件已停止旋轉，仔細辨認每個偏旁與部件！';
        hintBtn.innerHTML = '💡 提示 2 (合併部件)';
      } else if (currentStage === 2) {
        stageInfoEl.textContent = '提示 2：部分部件已合體！試著拼出完整的字！';
        hintBtn.innerHTML = '💡 提示 3 (揭曉答案)';
      } else if (currentStage === 3) {
        stageInfoEl.textContent = '提示 3：答案揭曉！✨';
        hintBtn.innerHTML = '💡 已揭曉';
        hintBtn.disabled = true;
      }

      gameAreaEl.innerHTML = '';

      if (currentStage === 0) {
        // 階段 0: 旋轉的散落部件
        const comps = q.stage0_components || [q.answer];
        comps.forEach((comp, idx) => {
          const card = document.createElement('div');
          card.className = 'component-card rotating';
          card.textContent = comp;
          // 各部件隨機些微差異的旋轉起點或速度
          card.style.animationDuration = (3.2 + (idx % 3) * 0.4) + 's';
          if (idx % 2 === 1) card.style.animationDirection = 'reverse';
          gameAreaEl.appendChild(card);
        });
      } else if (currentStage === 1) {
        // 階段 1: 停止旋轉的散落部件
        const comps = q.stage0_components || [q.answer];
        comps.forEach(comp => {
          const card = document.createElement('div');
          card.className = 'component-card';
          card.textContent = comp;
          gameAreaEl.appendChild(card);
        });
      } else if (currentStage === 2) {
        // 階段 2: 部件合併
        const comps = q.stage2_components || [q.answer];
        comps.forEach(comp => {
          const card = document.createElement('div');
          card.className = 'component-card merged';
          card.textContent = comp;
          gameAreaEl.appendChild(card);
        });
      } else if (currentStage === 3) {
        // 階段 3: 揭曉答案
        const ansBox = document.createElement('div');
        ansBox.className = 'answer-display';

        const charEl = document.createElement('div');
        charEl.className = 'answer-char';
        charEl.textContent = q.answer;

        const descEl = document.createElement('div');
        descEl.className = 'answer-desc';
        descEl.textContent = q.meaning || '生字學習';

        ansBox.appendChild(charEl);
        ansBox.appendChild(descEl);
        gameAreaEl.appendChild(ansBox);

        // 朗讀
        speakWord(q.answer + '，' + (q.meaning ? q.meaning.split('、')[0] : ''));
      }
    }

    // 下一個提示
    function nextHint() {
      if (currentStage < 3) {
        currentStage++;
        playHintSound(currentStage);
        renderCurrentState();
      }
    }

    // 上一題
    function prevQuestion() {
      if (currentIndex > 0) {
        currentIndex--;
        currentStage = 0;
        playTone(392, 'sine', 0.1, 0.08);
        renderCurrentState();
      }
    }

    // 下一題
    function nextQuestion() {
      if (currentIndex < questions.length - 1) {
        currentIndex++;
        currentStage = 0;
        playTone(523.25, 'sine', 0.1, 0.08);
        renderCurrentState();
      } else {
        // 最後一題
        currentStage = 0;
        currentIndex = 0;
        renderCurrentState();
      }
    }

    // 重新此題
    function resetQuestion() {
      currentStage = 0;
      playTone(330, 'sine', 0.1, 0.08);
      renderCurrentState();
    }

    // 鍵盤快捷鍵
    window.addEventListener('keydown', (e) => {
      // 忽略正在輸入文字的情況
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

      if (e.code === 'Space' || e.key.toLowerCase() === 'h') {
        e.preventDefault();
        nextHint();
      } else if (e.key === 'ArrowLeft' || e.key.toLowerCase() === 'p') {
        e.preventDefault();
        prevQuestion();
      } else if (e.key === 'ArrowRight' || e.key.toLowerCase() === 'n' || e.key === 'Enter') {
        e.preventDefault();
        nextQuestion();
      } else if (e.key.toLowerCase() === 'r') {
        e.preventDefault();
        resetQuestion();
      }
    });

    // 初始化第一課
    switchLesson('1');
  </script>
