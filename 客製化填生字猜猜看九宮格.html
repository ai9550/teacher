<!doctype html>
<html lang="zh-TW">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>自訂生字9宮格猜謎遊戲</title>
  <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft JhengHei', '微軟正黑體', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: white;
            gap: 30px;
            box-sizing: border-box;
        }

        /* 左側控制區 */
        .control-panel {
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
            width: 300px;
            max-height: 90vh;
            transition: all 0.3s ease;
            z-index: 10;
            position: relative;
        }

        .panel-title {
            font-size: 1.3rem;
            font-weight: bold;
            text-align: center;
            color: #ffeaa7;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
            margin-bottom: 5px;
        }

        .input-wrapper {
            position: relative;
            width: 100%;
            z-index: 5;
        }

        .input-area {
            width: 100%;
            height: 300px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 10px;
            padding: 15px;
            padding-bottom: 50px; /* 預留底部空間給按鈕 */
            border: 2px solid transparent;
            font-family: 'Microsoft JhengHei', sans-serif;
            font-size: 1.1rem;
            resize: vertical;
            color: #333;
            transition: all 0.3s;
            z-index: 1;
        }

        .input-area:focus {
            outline: none;
            border-color: #ffeaa7;
            box-shadow: 0 0 10px rgba(255, 234, 167, 0.5);
        }
        
        /* 遊戲進行中，輸入框變暗的樣式 */
        .input-area.masked {
            background: rgba(255, 255, 255, 0.2);
            color: rgba(255,255,255,0.8);
            text-align: center;
            padding-top: 100px;
            font-style: italic;
            pointer-events: none; /* 禁止點擊 */
        }

        .instruction {
            font-size: 0.9rem;
            color: #dfe6e9;
            line-height: 1.4;
            background: rgba(0,0,0,0.2);
            padding: 10px;
            border-radius: 10px;
        }

        .action-btn {
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
        }

        .btn-start {
            background: linear-gradient(135deg, #ffeaa7, #fdcb6e);
            color: #2d3436;
            box-shadow: 0 4px 10px rgba(253, 203, 110, 0.3);
        }

        .btn-start:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(253, 203, 110, 0.5);
        }

        .btn-edit {
            background: #ff7675;
            color: white;
            border: none;
            box-shadow: 0 4px 10px rgba(214, 48, 49, 0.3);
        }

        .btn-edit:hover {
            background: #d63031;
            transform: translateY(-2px);
        }
        
        .btn-clear {
            position: absolute;
            bottom: 15px;
            right: 15px;
            background: #dfe6e9;
            border: 1px solid #b2bec3;
            color: #636e72;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.95rem;
            z-index: 100; /* 確保層級最高 */
            transition: all 0.2s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .btn-clear:hover {
            background: #d63031;
            color: white;
            border-color: #d63031;
            transform: translateY(-1px);
        }
        .btn-clear:active {
            transform: translateY(1px);
        }

        /* 右側遊戲區 */
        .main-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
            max-width: 600px;
            transition: opacity 0.3s ease;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .question-counter {
            color: #ffeaa7;
            font-weight: bold;
            font-size: 1.2rem;
            display: block;
            margin-top: 5px;
        }

        .game-container {
            position: relative;
            width: 320px;
            height: 320px;
            margin: 10px auto;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            overflow: hidden;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .character-card {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: normal;
            color: #2d3436;
            font-family: '標楷體', 'DFKai-SB', serif;
            line-height: 1; 
            text-align: center;
            user-select: none;
            transition: opacity 0.2s; /* 文字切換時的淡入淡出 */
        }

        .overlay-grid {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            grid-template-rows: 1fr 1fr 1fr;
            gap: 0;
            z-index: 5;
        }

        .overlay-block {
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            font-weight: bold;
            color: white;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .overlay-block:hover {
            filter: brightness(1.1);
            z-index: 2;
        }

        .overlay-block:active {
            transform: scale(0.95);
        }

        .overlay-block.clicked {
            opacity: 0;
            pointer-events: none;
            transform: scale(0.8);
        }

        /* 九宮格顏色 */
        .block-1 { background: linear-gradient(135deg, #ff6b6b, #ee5a24); }
        .block-2 { background: linear-gradient(135deg, #4ecdc4, #44a08d); }
        .block-3 { background: linear-gradient(135deg, #ffeaa7, #fdcb6e); }
        .block-4 { background: linear-gradient(135deg, #a29bfe, #6c5ce7); }
        .block-5 { background: linear-gradient(135deg, #fd79a8, #e84393); }
        .block-6 { background: linear-gradient(135deg, #fab1a0, #e17055); }
        .block-7 { background: linear-gradient(135deg, #00b894, #00cec9); }
        .block-8 { background: linear-gradient(135deg, #fdcb6e, #e17055); }
        .block-9 { background: linear-gradient(135deg, #74b9ff, #0984e3); }

        .block-number {
            position: absolute;
            top: 5px;
            right: 5px;
            background: rgba(0,0,0,0.2);
            border-radius: 50%;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
        }

        .game-controls {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 25px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
        }

        .btn-primary {
            background: #ffeaa7;
            color: #2d3436;
        }
        .btn-primary:hover { background: #fdcb6e; transform: translateY(-2px); }

        .btn-secondary {
            background: white;
            color: #6c5ce7;
        }
        .btn-secondary:hover { background: #f1f2f6; transform: translateY(-2px); }

        .btn-danger {
            background: #ff7675;
            color: white;
        }
        .btn-danger:hover { background: #d63031; transform: translateY(-2px); }


        .completion-message {
            background: rgba(46, 213, 115, 0.95);
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            margin-top: 20px;
            backdrop-filter: blur(5px);
            display: none;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            z-index: 20;
        }

        .completion-message.show {
            display: block;
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            from { opacity: 0; transform: scale(0.8) translateY(20px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        /* 狀態切換類別 */
        .hidden {
            display: none !important;
        }

        .disabled-area {
            pointer-events: none;
            opacity: 0.6;
            background: rgba(255,255,255,0.5);
        }

        @media (max-width: 768px) {
            body {
                flex-direction: column;
                padding: 10px;
                gap: 15px;
            }

            .control-panel {
                width: 100%;
                padding: 15px;
            }
            
            .input-area {
                height: 150px;
            }

            .game-container {
                width: 280px;
                height: 280px;
            }
            
            .header h1 {
                font-size: 1.8rem;
            }
            
            .main-content {
                width: 100%;
            }
        }
    </style>
   <style>
    /* 強制將生字、語詞、題目的字體改為非粗體 (正常標楷體) */
    .character, .char, .word, .vocab, .meaning, .question, .answer, .answer-char, .character-card, .overlay-char, .block, strong, b, .char-display, .word-display, .bingo-cell, .mole-char, .question-char, .stage0-char, .stage2-char, .hint-text, .question-text {
        font-weight: normal !important;
    }
  </style>
</head>
 <body>
  
  <!-- 左側設定面板 -->
  <div class="control-panel" id="controlPanel">
    <div class="panel-title">📝 題目設定</div>
    
    <div class="instruction">
        <strong>使用說明：</strong><br>
        請在下方輸入生字，一行一個。<br>
        <em>提示：點「清空」可快速清除。</em>
    </div>

    <div class="input-wrapper">
        <textarea id="vocabInput" class="input-area" placeholder="在此輸入生字...
例如：
隙
竄
旨">
隙
竄
旨</textarea>
        <button type="button" id="clearBtn" class="btn-clear" onclick="clearInput()">🗑️ 清空</button>
    </div>

    <button id="startBtn" class="action-btn btn-start" onclick="startGame()">
        <span>▶️ 開始遊戲</span>
    </button>

    <div id="gameStatus" class="instruction hidden" style="text-align: center; background: rgba(0,0,0,0.4);">
        遊戲進行中...
    </div>

    <button id="editBtn" class="action-btn btn-edit hidden" onclick="enableEditing()">
        <span>✏️ 修改題目 / 重新設定</span>
    </button>
  </div>

  <!-- 右側遊戲區 -->
  <div class="main-content hidden" id="gameArea">
   <div class="header">
    <h1>🎲 生字九宮格猜謎</h1>
    <span id="questionCounter" class="question-counter">(第 1 題 / 共 ? 題)</span>
   </div>
   
   <div class="game-container">
    <div class="character-card" id="charDisplay">
     ?
    </div>
    <div class="overlay-grid" id="grid">
     <!-- 網格由 JS 生成 -->
    </div>
   </div>

   <div class="game-controls">
    <button class="btn btn-danger" onclick="resetCurrentRound()">🔄 重置本題</button>
    <button class="btn btn-primary" onclick="revealAll()">👁️ 看答案</button>
    <button class="btn btn-secondary" id="btnNext" onclick="nextQuestion()">🎲 下一題</button>
   </div>

   <div class="completion-message" id="completionMessage">
    <!-- 完成訊息由 JS 生成 -->
   </div>
  </div>

  <script>
        // 遊戲狀態
        let gameData = [];
        let currentIndex = 0;
        let shuffledIndices = [];
        let revealedBlocks = new Set();
        let isTransitioning = false; // 防止重複點擊
        let savedInputContent = ""; // 暫存使用者輸入的內容
        const totalBlocks = 9;

        // DOM 元素
        const vocabInput = document.getElementById('vocabInput');
        const gameArea = document.getElementById('gameArea');
        const controlPanel = document.getElementById('controlPanel');
        const editBtn = document.getElementById('editBtn');
        const startBtn = document.getElementById('startBtn');
        const gameStatus = document.getElementById('gameStatus');
        const grid = document.getElementById('grid');
        const charDisplay = document.getElementById('charDisplay');
        const msgBox = document.getElementById('completionMessage');
        const clearBtn = document.getElementById('clearBtn');
        const btnNext = document.getElementById('btnNext');

        // 確保清空功能在全域範圍
        window.clearInput = function() {
            if(confirm("確定要清空所有內容嗎？")) {
                vocabInput.value = "";
                vocabInput.focus();
            }
        };

        // 初始化網格
        function initGrid() {
            grid.innerHTML = '';
            for(let i=1; i<=9; i++) {
                const div = document.createElement('div');
                div.className = `overlay-block block-${i}`;
                div.onclick = () => revealBlock(i);
                div.innerHTML = `<div class="block-number">${i}</div><div>點我</div>`;
                grid.appendChild(div);
            }
        }

        // 解析輸入資料
        function parseInput() {
            const rawText = vocabInput.value.trim();
            if (!rawText) {
                alert("請先輸入一些生字！");
                return false;
            }

            const lines = rawText.split('\n');
            gameData = [];

            lines.forEach(line => {
                line = line.trim();
                if (line) {
                    const parts = line.split(/[,，\s]+/); 
                    const char = parts[0];
                    const meaning = parts.slice(1).join(' ') || '尚無提示';
                    
                    if (char) {
                        gameData.push({ char, meaning });
                    }
                }
            });

            if (gameData.length === 0) {
                alert("無法解析生字，請檢查格式。");
                return false;
            }

            return true;
        }

        // 開始遊戲
        function startGame() {
            if (!parseInput()) return;

            // 1. 暫存輸入內容
            savedInputContent = vocabInput.value;

            // 2. 隱藏輸入框內容，防止學生偷看
            vocabInput.value = "🙈 遊戲進行中\n生字清單已隱藏";
            vocabInput.classList.add('masked'); // 增加特殊樣式
            vocabInput.readOnly = true; // 設為唯讀

            // UI 切換
            startBtn.classList.add('hidden');
            gameStatus.classList.remove('hidden');
            editBtn.classList.remove('hidden');
            clearBtn.style.display = 'none'; // 遊戲中隱藏清空按鈕
            
            // 顯示遊戲區
            gameArea.classList.remove('hidden');
            
            // 在手機版，自動捲動到遊戲區
            if(window.innerWidth <= 768) {
                gameArea.scrollIntoView({behavior: 'smooth'});
            }

            // 遊戲初始化
            initGrid();
            initializeRandomOrder();
        }

        // 啟用編輯模式
        function enableEditing() {
            gameArea.classList.add('hidden');
            
            // 1. 恢復原本輸入的內容
            if (savedInputContent) {
                vocabInput.value = savedInputContent;
            }
            
            // 2. 移除遮蔽樣式與狀態
            vocabInput.classList.remove('masked');
            vocabInput.readOnly = false;
            vocabInput.classList.remove('disabled-area');

            startBtn.classList.remove('hidden');
            gameStatus.classList.add('hidden');
            editBtn.classList.add('hidden');
            clearBtn.style.display = 'block'; // 恢復清空按鈕顯示
            
            vocabInput.focus();
            
            if(window.innerWidth <= 768) {
                controlPanel.scrollIntoView({behavior: 'smooth'});
            }
        }

        // 初始化隨機順序
        function initializeRandomOrder() {
            shuffledIndices = Array.from({length: gameData.length}, (_, i) => i);
            for (let i = shuffledIndices.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffledIndices[i], shuffledIndices[j]] = [shuffledIndices[j], shuffledIndices[i]];
            }
            currentIndex = 0;
            loadQuestion(false); // 第一次載入不需要延遲
        }

        // 載入題目 (增加 delayed 參數)
        function loadQuestion(delayed = false) {
            // 1. 先重置網格 (蓋起來) - 讓使用者看到蓋起來的過程
            resetCurrentRound();
            msgBox.classList.remove('show');
            isTransitioning = true; // 鎖定按鈕

            if (gameData.length === 0) return;

            if (delayed) {
                // 如果需要延遲 (點下一題時)
                btnNext.disabled = true; // 暫時停用按鈕
                btnNext.innerText = "準備中...";
                
                setTimeout(() => {
                    updateCharacterData(); // 1秒後才換字
                    btnNext.disabled = false;
                    btnNext.innerText = "🎲 下一題";
                    isTransitioning = false;
                }, 1000); // 1秒延遲，此時網格已經蓋上，學生看到的是蓋著的舊字，然後變成蓋著的新字
            } else {
                // 如果是剛開始或重置，立即顯示
                updateCharacterData();
                isTransitioning = false;
            }
        }

        // 實際更新文字與字體大小
        function updateCharacterData() {
            const data = gameData[shuffledIndices[currentIndex]];
            
            // 設定文字
            charDisplay.textContent = data.char;
            
            // 字體大小調整 (極大化)
            const len = data.char.length;
            if (len === 1) charDisplay.style.fontSize = '19.5rem'; 
            else if (len === 2) charDisplay.style.fontSize = '9.5rem'; 
            else if (len === 3) charDisplay.style.fontSize = '6.5rem';
            else charDisplay.style.fontSize = '4.5rem';

            // 手機版字體微調
            if (window.innerWidth <= 768) {
                if (len === 1) charDisplay.style.fontSize = '15rem';
                else if (len === 2) charDisplay.style.fontSize = '8rem';
                else charDisplay.style.fontSize = '5rem';
            }

            // 更新計數器
            document.getElementById('questionCounter').textContent = 
                `(第 ${currentIndex + 1} 題 / 共 ${gameData.length} 題)`;
        }

        // 點擊方塊
        function revealBlock(n) {
            if (isTransitioning) return; // 切換題目中不能點
            
            const block = document.querySelector(`.block-${n}`);
            if (block && !block.classList.contains('clicked')) {
                block.classList.add('clicked');
                revealedBlocks.add(n);

                if (revealedBlocks.size === totalBlocks) {
                    setTimeout(showCompletion, 500);
                }
            }
        }

        // 顯示全部
        function revealAll() {
            for(let i=1; i<=9; i++) {
                const block = document.querySelector(`.block-${i}`);
                if(block) block.classList.add('clicked');
                revealedBlocks.add(i);
            }
            setTimeout(showCompletion, 300);
        }

        // 重置本題
        function resetCurrentRound() {
            revealedBlocks.clear();
            const blocks = document.querySelectorAll('.overlay-block');
            blocks.forEach(b => b.classList.remove('clicked'));
            msgBox.classList.remove('show');
        }

        // 下一題
        function nextQuestion() {
            if (isTransitioning) return; // 防止連點

            currentIndex++;
            if (currentIndex >= gameData.length) {
                if(confirm("題目已全部完成！要重新開始嗎？")) {
                    initializeRandomOrder();
                } else {
                    currentIndex = gameData.length - 1;
                }
            } else {
                // 這裡傳入 true，表示需要延遲換字
                loadQuestion(true);
            }
        }

        // 顯示完成訊息
        function showCompletion() {
            const data = gameData[shuffledIndices[currentIndex]];
            msgBox.innerHTML = `
                <h2>🎉 答對了！</h2>
                <div style="margin: 10px 0;">
                    <div style="font-size: 3rem; color: #2d3436; font-family: '標楷體';">${data.char}</div>
                    <div style="font-size: 1.2rem; color: white; margin-top: 5px;">${data.meaning}</div>
                </div>
                <div>
                    <button class="btn btn-primary" onclick="resetCurrentRound()">再玩一次</button>
                    <button class="btn btn-secondary" onclick="nextQuestion()">下一題 ➡️</button>
                </div>
            `;
            msgBox.classList.add('show');
        }

        // 鍵盤支援
        document.addEventListener('keydown', (e) => {
            if (gameArea.classList.contains('hidden')) return;
            if (document.activeElement === vocabInput) return;
            if (isTransitioning) return;

            const key = e.key;
            if (key >= '1' && key <= '9') revealBlock(parseInt(key));
            if (key === ' ' || key === 'Enter') {
                e.preventDefault();
                revealAll();
            }
            if (key === 'n' || key === 'N') nextQuestion();
            if (key === 'r' || key === 'R') resetCurrentRound();
        });

  </script>
 </body>
</html>
