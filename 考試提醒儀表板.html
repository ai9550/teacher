<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>學校考試儀表板</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&family=Kosugi+Maru&family=VT323&family=Orbitron:wght@500;700;900&family=M+PLUS+Rounded+1c:wght@400;700;900&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        /* ==================== 核心變數 (預設黑板風格) ==================== */
        :root {
            --bg-color: #1e3a29;
            --text-color: #f4f4f0;
            --font-main: 'Noto Sans TC', sans-serif;
            --font-clock: monospace;
            --accent-color: #ffd700;
            --accent-color-2: #8be9fd;
            --border-style: 3px solid rgba(255, 255, 255, 0.6);
            --border-radius: 8px;
            --panel-bg: rgba(0, 0, 0, 0.2);
            --shadow: inset 0 0 10px rgba(0,0,0,0.2), 0 0 5px rgba(255,255,255,0.1);
            --progress-bg: rgba(255, 255, 255, 0.1);
            --progress-fill: #50fa7b;
            --progress-warning: #ff5555;
            --progress-indicator-shape: '🐢'; /* 用字元模擬形狀，後續用 JS 改為純 CSS 或不同符號 */
            --bg-image: linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
            --bg-size: 20px 20px;
        }

        /* ==================== 風格定義 ==================== */
        /* 1. 黑板風格 (Blackboard) - 預設已在 :root */
        
        /* 2. 日系櫻花風格 (Sakura) */
        body.theme-sakura {
            --bg-color: #fff0f5;
            --text-color: #5c4059;
            --font-main: 'Kosugi Maru', 'Noto Sans TC', sans-serif;
            --font-clock: 'Kosugi Maru', sans-serif;
            --accent-color: #e83e8c;
            --accent-color-2: #d63384;
            --border-style: 2px solid #ffb7c5;
            --border-radius: 20px;
            --panel-bg: rgba(255, 255, 255, 0.8);
            --shadow: 0 8px 32px 0 rgba(255, 183, 197, 0.37);
            --progress-bg: #ffe4e1;
            --progress-fill: #ffb7c5;
            --progress-warning: #ff6b6b;
            --bg-image: radial-gradient(circle at 50% 50%, rgba(255, 183, 197, 0.2) 0%, transparent 100%);
            --bg-size: 100vw 100vh;
        }

        /* 3. Minecraft風格 (Minecraft) */
        body.theme-minecraft {
            --bg-color: #729c3a; /* 草地綠 */
            --text-color: #ffffff;
            --font-main: 'VT323', monospace;
            --font-clock: 'VT323', monospace;
            --accent-color: #f7e914; /* 金塊色 */
            --accent-color-2: #55ffff; /* 鑽石色 */
            --border-style: 4px solid #3c3c3c; /* 像素感邊框 */
            --border-radius: 0px;
            --panel-bg: rgba(139, 139, 139, 0.9); /* 石頭色 */
            --shadow: inset -4px -4px 0px 0px rgba(0,0,0,0.5), inset 4px 4px 0px 0px rgba(255,255,255,0.5);
            --progress-bg: #4a4a4a;
            --progress-fill: #55ff55;
            --progress-warning: #ff5555;
            --bg-image: repeating-linear-gradient(45deg, #729c3a 25%, transparent 25%, transparent 75%, #729c3a 75%, #729c3a), repeating-linear-gradient(45deg, #729c3a 25%, #6a9235 25%, #6a9235 75%, #729c3a 75%, #729c3a);
            --bg-size: 32px 32px;
        }

        /* 4. 科技風格 (Sci-Fi) */
        body.theme-scifi {
            --bg-color: #0b0f19;
            --text-color: #00f0ff;
            --font-main: 'Orbitron', sans-serif;
            --font-clock: 'Orbitron', monospace;
            --accent-color: #ff003c;
            --accent-color-2: #fcee0a;
            --border-style: 1px solid #00f0ff;
            --border-radius: 0px;
            --panel-bg: rgba(0, 24, 40, 0.7);
            --shadow: 0 0 15px rgba(0, 240, 255, 0.3), inset 0 0 20px rgba(0, 240, 255, 0.1);
            --progress-bg: rgba(0, 240, 255, 0.1);
            --progress-fill: #00f0ff;
            --progress-warning: #ff003c;
            --bg-image: linear-gradient(0deg, transparent 24%, rgba(0, 240, 255, 0.1) 25%, rgba(0, 240, 255, 0.1) 26%, transparent 27%, transparent 74%, rgba(0, 240, 255, 0.1) 75%, rgba(0, 240, 255, 0.1) 76%, transparent 77%, transparent), linear-gradient(90deg, transparent 24%, rgba(0, 240, 255, 0.1) 25%, rgba(0, 240, 255, 0.1) 26%, transparent 27%, transparent 74%, rgba(0, 240, 255, 0.1) 75%, rgba(0, 240, 255, 0.1) 76%, transparent 77%, transparent);
            --bg-size: 50px 50px;
        }

        /* 5. 可愛風格 (Cute) */
        body.theme-cute {
            --bg-color: #fff9e6;
            --text-color: #7b5e52;
            --font-main: 'M PLUS Rounded 1c', sans-serif;
            --font-clock: 'M PLUS Rounded 1c', sans-serif;
            --accent-color: #ff9b9b;
            --accent-color-2: #84d8d3;
            --border-style: 4px dashed #ffcaa6;
            --border-radius: 30px;
            --panel-bg: rgba(255, 255, 255, 0.9);
            --shadow: 0 10px 20px rgba(255, 202, 166, 0.3);
            --progress-bg: #ffeee6;
            --progress-fill: #ffb38a;
            --progress-warning: #ff9b9b;
            --bg-image: radial-gradient(#ffcaa6 3px, transparent 4px);
            --bg-size: 30px 30px;
        }

        /* ==================== 基礎佈局 ==================== */
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-main);
            min-height: 100vh;
            background-attachment: fixed;
            background-image: var(--bg-image);
            background-size: var(--bg-size);
            transition: all 0.5s ease; /* 切換風格時的漸變效果 */
        }

        h1, h2, h3 {
            letter-spacing: 2px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1); /* 減輕陰影，依賴各風格設定 */
        }

        /* 共用邊框樣式 (套用變數) */
        .theme-box {
            border: var(--border-style);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            background-color: var(--panel-bg);
            backdrop-filter: blur(5px);
        }

        .hidden { display: none !important; }

        /* --- 第一頁：設定畫面 --- */
        #setup-page {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .setup-container {
            width: 100%;
            max-width: 900px;
            padding: 40px;
            margin: 20px 0;
            transition: all 0.5s ease;
        }

        .setup-section { margin-bottom: 30px; }
        .setup-section h2 {
            font-size: 2rem;
            margin-bottom: 20px;
            color: var(--accent-color);
            border-bottom: 2px dashed var(--accent-color);
            padding-bottom: 10px;
        }

        /* 按鈕共用邏輯 */
        .btn-grid {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .theme-btn {
            background: transparent;
            color: var(--text-color);
            font-size: 1.5rem;
            padding: 15px 30px;
            cursor: pointer;
            position: relative;
            transition: all 0.2s;
            border: var(--border-style);
            border-radius: var(--border-radius);
            font-family: var(--font-main);
        }

        .theme-btn:hover { background-color: rgba(128,128,128,0.1); }
        .theme-btn.selected {
            background-color: var(--accent-color);
            color: var(--bg-color);
            font-weight: bold;
            border-color: var(--accent-color);
            box-shadow: 0 0 15px var(--accent-color);
        }

        .subject-btn .order-badge {
            position: absolute;
            top: -10px; right: -10px;
            background-color: var(--accent-color-2);
            color: var(--bg-color);
            border-radius: 50%;
            width: 30px; height: 30px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.2rem; font-weight: bold;
            z-index: 2;
        }

        /* 提醒事項清單 */
        .reminders-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        @media (max-width: 800px) { .reminders-grid { grid-template-columns: 1fr; } }
        .reminder-option {
            background: var(--panel-bg);
            color: var(--text-color);
            font-size: 1.2rem;
            padding: 10px 15px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            line-height: 1.4;
        }
        .reminder-option:hover { filter: brightness(1.2); }
        .reminder-option.selected {
            background-color: var(--accent-color);
            color: var(--bg-color);
            font-weight: bold;
        }

        /* 數字盒 */
        .attendance-setup {
            display: flex; gap: 40px; justify-content: center; flex-wrap: wrap;
        }
        .number-box-wrapper { text-align: center; }
        .number-box-wrapper label { display: block; font-size: 1.5rem; margin-bottom: 10px; color: var(--text-color);}
        .number-box {
            width: 120px; height: 80px;
            font-size: 3rem;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            background-color: var(--panel-bg);
            transition: all 0.2s;
            color: var(--text-color);
            font-family: var(--font-clock);
        }
        .number-box:hover { filter: brightness(1.2); }
        .number-box.active {
            border-color: var(--accent-color);
            box-shadow: 0 0 20px var(--accent-color);
        }

        /* 底部大按鈕 */
        .action-btn {
            background-color: var(--panel-bg);
            font-size: 2rem;
            padding: 15px 30px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
            font-family: var(--font-main);
        }
        #btn-start { color: var(--accent-color); border-color: var(--accent-color); }
        #btn-start:hover:not(:disabled) { background-color: var(--accent-color); color: var(--bg-color); transform: scale(1.05); }
        #btn-start:disabled { opacity: 0.5; cursor: not-allowed; border-color: gray; color: gray; }
        
        .stats-btn { color: var(--accent-color-2); border-color: var(--accent-color-2); }
        .stats-btn:hover { background-color: var(--accent-color-2); color: var(--bg-color); transform: scale(1.05); }

        /* --- 數字鍵盤 --- */
        #numpad-modal {
            position: fixed; top: 50%; right: 20px; transform: translateY(-50%); z-index: 1000;
        }
        .numpad-container {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
            padding: 20px;
        }
        .numpad-btn {
            background: var(--panel-bg); color: var(--text-color);
            border: var(--border-style); border-radius: var(--border-radius);
            font-size: 2rem; padding: 12px 20px; cursor: pointer; transition: all 0.1s;
            font-family: var(--font-clock);
        }
        .numpad-btn:active { transform: scale(0.95); }
        .numpad-btn.action { font-size: 1.5rem; color: var(--accent-color); font-family: var(--font-main); }
        .numpad-btn.zero { grid-column: span 2; }

        /* --- 第二頁：儀表板 --- */
        #dashboard-page {
            height: 100vh; width: 100vw; overflow: hidden;
            padding: 2vmin;
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            grid-template-rows: 4.5fr 4fr 1.2fr;
            gap: 2vmin;
            position: relative;
        }

        .back-btn {
            position: absolute; top: 2vh; right: 2vh;
            background-color: var(--panel-bg); color: var(--text-color);
            font-size: 1.2rem; padding: 8px 16px; cursor: pointer; z-index: 100;
            border: var(--border-style); border-radius: var(--border-radius);
            font-family: var(--font-main);
        }
        .back-btn:hover { filter: brightness(1.2); }

        .panel {
            padding: 2vmin; display: flex; flex-direction: column;
        }
        .panel-title {
            font-size: clamp(1.5rem, 3.5vmin, 3.5rem);
            color: var(--accent-color);
            border-bottom: 2px solid var(--accent-color);
            padding-bottom: 0.5vmin; margin-bottom: 1.5vmin; text-align: center;
        }

        /* A區: 今日考程 (巨大化) */
        .area-a { grid-column: span 3; }
        .schedule-list { flex-grow: 1; display: flex; flex-direction: column; justify-content: center; align-items: center;}
        
        /* B區: 現在時間 */
        .area-b { grid-column: span 2; justify-content: center; align-items: center; }
        .clock-display {
            font-size: clamp(5.5rem, 13vmin, 18rem);
            font-weight: 900; font-family: var(--font-clock);
            text-align: center; line-height: 1; letter-spacing: 2px;
            color: var(--accent-color-2);
        }
        .date-display {
            font-size: clamp(1.5rem, 3.5vmin, 4.5rem);
            text-align: center; margin-top: 2vmin; color: var(--text-color); opacity: 0.8;
        }

        /* C區: 人數統計 */
        .area-c { grid-column: span 2; }
        .attendance-stats { flex-grow: 1; display: flex; flex-direction: column; justify-content: space-around; padding: 0 10%; }
        .stat-row { display: flex; justify-content: space-between; align-items: baseline; font-size: clamp(1.5rem, 4.5vmin, 5rem); }
        .stat-row.absent { color: var(--progress-warning); font-weight: bold; }
        .stat-number { font-size: 1.8em; font-weight: 900; margin-right: 8px; font-family: var(--font-clock);}

        /* D區: 考生提醒 */
        .area-d { grid-column: span 3; justify-content: center; position: relative; }
        .reminder-content {
            flex-grow: 1; display: flex; align-items: center; justify-content: center; text-align: center;
            font-size: clamp(3rem, 8vmin, 9rem); font-weight: bold; padding: 0 2vmin; line-height: 1.4;
            color: var(--accent-color-2); 
            animation: fadeInOut 20s infinite;
        }
        @keyframes fadeInOut {
            0%, 5% { opacity: 0; transform: scale(0.95); }
            10%, 90% { opacity: 1; transform: scale(1); }
            95%, 100% { opacity: 0; transform: scale(0.95); }
        }

        /* E區: 考試進度條 */
        .area-e { grid-column: span 5; flex-direction: row; align-items: center; gap: 2vmin; padding: 1vmin 2vmin; }
        .progress-label { font-size: clamp(1.5rem, 3vmin, 3.5rem); white-space: nowrap; color: var(--text-color);}
        .progress-bar-container {
            flex-grow: 1; height: 5vmin; background-color: var(--progress-bg);
            border: var(--border-style); border-radius: var(--border-radius); position: relative;
        }
        .progress-bar-fill {
            height: 100%; width: 0%; background-color: var(--progress-fill); 
            border-radius: calc(var(--border-radius) / 2); transition: width 1s linear, background-color 1s;
        }
        
        /* 依據風格變化的進度指示器 (取代烏龜) */
        .progress-indicator {
            position: absolute; top: 50%; left: 0%; transform: translate(-50%, -50%);
            transition: left 1s linear; z-index: 10;
        }
        /* 1. 黑板: 粉筆板擦 */
        body.theme-blackboard .progress-indicator {
            width: 4vmin; height: 6vmin; background-color: #f4ea2a; border: 2px solid white; border-radius: 4px; box-shadow: 2px 2px 5px rgba(0,0,0,0.5);
        }
        /* 2. 櫻花: 櫻花花瓣 */
        body.theme-sakura .progress-indicator {
            font-size: clamp(2.5rem, 5vmin, 6rem); content: "🌸"; 
            animation: spinSakura 4s linear infinite;
        }
        body.theme-sakura .progress-indicator::before { content: "🌸"; text-shadow: 0 0 10px rgba(255,183,197,0.8);}
        @keyframes spinSakura { 100% { transform: translate(-50%, -50%) rotate(360deg); } }
        /* 3. Minecraft: 鑽石鎬/方塊 (用方形代表) */
        body.theme-minecraft .progress-indicator {
            width: 5vmin; height: 5vmin; background-color: #55ffff; border: 3px solid #3c3c3c; box-shadow: inset -2px -2px 0px 0px rgba(0,0,0,0.3);
        }
        /* 4. 科技: 發光光點/箭頭 */
        body.theme-scifi .progress-indicator {
            width: 0; height: 0; border-top: 3vmin solid transparent; border-bottom: 3vmin solid transparent; border-left: 4vmin solid #00f0ff;
            filter: drop-shadow(0 0 10px #00f0ff); transform: translate(-20%, -50%); /* 修正三角形中心點 */
        }
        /* 5. 可愛: 貓掌 */
        body.theme-cute .progress-indicator {
            font-size: clamp(2.5rem, 5vmin, 6rem);
            animation: bounceCute 1s infinite alternate;
        }
        body.theme-cute .progress-indicator::before { content: "🐾"; }
        @keyframes bounceCute { 100% { transform: translate(-50%, -80%); } }

        .progress-text {
            position: absolute; width: 100%; text-align: center; top: 50%; transform: translateY(-50%);
            font-size: clamp(1.2rem, 2.5vmin, 3rem); font-weight: bold; color: var(--bg-color); z-index: 5; pointer-events: none;
            text-shadow: 0 0 5px rgba(255,255,255,0.8);
        }
        .progress-status { font-size: clamp(1.5rem, 3vmin, 3.5rem); min-width: 15vw; text-align: right; color: var(--accent-color); }

    </style>
</head>
<body class="theme-blackboard">

    <!-- ==================== 第一頁：設定畫面 ==================== -->
    <div id="setup-page">
        <div class="setup-container theme-box">
            <h1 style="text-align: center; font-size: 3rem; margin-bottom: 40px;">考試儀表板設定</h1>
            
            <!-- 新增：風格選擇 -->
            <div class="setup-section">
                <h2>1. 選擇儀表板風格 (即時預覽)</h2>
                <div class="btn-grid" id="themes-container">
                    <button class="theme-btn theme-box selected" onclick="setTheme('blackboard', this)">1. 黑板風格</button>
                    <button class="theme-btn theme-box" onclick="setTheme('sakura', this)">2. 日系櫻花</button>
                    <button class="theme-btn theme-box" onclick="setTheme('minecraft', this)">3. Minecraft</button>
                    <button class="theme-btn theme-box" onclick="setTheme('scifi', this)">4. 科技風格</button>
                    <button class="theme-btn theme-box" onclick="setTheme('cute', this)">5. 可愛風格</button>
                </div>
            </div>

            <div class="setup-section">
                <h2>2. 選擇考試科目 (依順序勾選，最多4科)</h2>
                <div class="btn-grid" id="subjects-container"></div>
            </div>

            <div class="setup-section">
                <h2>3. 班級設定 (點擊數字盒輸入)</h2>
                <div class="attendance-setup">
                    <div class="number-box-wrapper"><label>年級</label><div class="number-box theme-box" id="box-grade" onclick="openNumpad('grade')">0</div></div>
                    <div class="number-box-wrapper"><label>班級</label><div class="number-box theme-box" id="box-classNum" onclick="openNumpad('classNum')">0</div></div>
                </div>
            </div>

            <div class="setup-section">
                <h2>4. 人數設定 (點擊數字盒輸入)</h2>
                <div class="attendance-setup">
                    <div class="number-box-wrapper"><label>應到</label><div class="number-box theme-box" id="box-expected" onclick="openNumpad('expected')">0</div></div>
                    <div class="number-box-wrapper"><label>實到</label><div class="number-box theme-box" id="box-actual" onclick="openNumpad('actual')">0</div></div>
                    <div class="number-box-wrapper" style="opacity: 0.7;"><label>缺考(自動)</label><div class="number-box theme-box" id="box-absent" style="cursor: default; border-style: dashed;">0</div></div>
                </div>
            </div>

            <div class="setup-section">
                <h2>5. 考生提醒事項 (點選勾選要輪播的項目)</h2>
                <div class="reminders-grid" id="reminders-container"></div>
            </div>

            <div style="display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; margin-top: 20px;">
                <button class="action-btn theme-box" id="btn-start" disabled onclick="submitToSheetAndStart()">開始提醒畫面 / 上傳人數</button>
                <button class="action-btn theme-box stats-btn" onclick="window.open('https://docs.google.com/spreadsheets/d/1ipGh3LuITJYRZzC6BDPqTVA1SG7uWUleBo3Lg8l8OIY/preview', '_blank')">📊 目前人數統計</button>
            </div>
        </div>
    </div>

    <!-- 數字鍵盤 Modal -->
    <div id="numpad-modal" class="hidden">
        <div class="numpad-container theme-box">
            <button class="numpad-btn" onclick="pressNumpad(1)">1</button><button class="numpad-btn" onclick="pressNumpad(2)">2</button><button class="numpad-btn" onclick="pressNumpad(3)">3</button>
            <button class="numpad-btn" onclick="pressNumpad(4)">4</button><button class="numpad-btn" onclick="pressNumpad(5)">5</button><button class="numpad-btn" onclick="pressNumpad(6)">6</button>
            <button class="numpad-btn" onclick="pressNumpad(7)">7</button><button class="numpad-btn" onclick="pressNumpad(8)">8</button><button class="numpad-btn" onclick="pressNumpad(9)">9</button>
            <button class="numpad-btn action" onclick="pressNumpad('clear')">清除</button><button class="numpad-btn zero" onclick="pressNumpad(0)">0</button>
            <button class="numpad-btn action" style="grid-column: span 3;" onclick="closeNumpad()">確定</button>
        </div>
    </div>

    <!-- ==================== 第二頁：儀表板畫面 ==================== -->
    <div id="dashboard-page" class="hidden">
        <button class="back-btn" onclick="backToSetup()">⚙️ 回到設定</button>

        <div class="panel theme-box area-a">
            <div class="panel-title">📝 考試科目</div>
            <div class="schedule-list" id="display-schedule"></div>
        </div>

        <div class="panel theme-box area-b">
            <div class="panel-title">⏱️ 現在時間</div>
            <div class="clock-display" id="display-clock">00:00:00</div>
            <div class="date-display" id="display-date">年/月/日 (星期)</div>
        </div>

        <div class="panel theme-box area-c">
            <div class="panel-title">👥 人數統計</div>
            <div class="attendance-stats">
                <div class="stat-row"><span>應到：</span><div><span id="display-expected" class="stat-number">0</span>人</div></div>
                <div class="stat-row"><span>實到：</span><div><span id="display-actual" class="stat-number">0</span>人</div></div>
                <div class="stat-row absent"><span>缺考：</span><div><span id="display-absent" class="stat-number">0</span>人</div></div>
            </div>
        </div>

        <div class="panel theme-box area-d">
            <div class="panel-title">💡 考生提醒</div>
            <div class="reminder-content" id="display-reminder"></div>
        </div>

        <div class="panel theme-box area-e">
            <div class="progress-label">考試進度</div>
            <div class="progress-bar-container">
                <div class="progress-bar-fill" id="progress-fill"></div>
                <div class="progress-indicator" id="progress-indicator"></div>
                <div class="progress-text" id="progress-text">準備中...</div>
            </div>
            <div class="progress-status" id="progress-status">等待考試</div>
        </div>
    </div>

    <!-- ==================== JavaScript 邏輯 ==================== -->
    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzbn6r3G6nUweVwA3RfNlxyxSU1mR0PWpXQNGoNhqvs9R9zHfG8kcx6mP4thMuHGt-w/exec";
        const ALL_SUBJECTS = ["國語", "數學", "自然", "社會", "英文"];
        const EXAM_TIMES = [
            { start: "08:40", end: "09:20" }, { start: "09:35", end: "10:15" },
            { start: "10:30", end: "11:10" }, { start: "11:20", end: "12:00" }
        ];
        const REMINDERS = [
            "拿到考卷先寫名字", "桌上只有鉛筆、橡皮擦、考卷", "不會的題目先跳過",
            "寫完一定要再檢查一遍看看有無沒寫", "有問題請舉手", "不要看別人，不要唱歌和製造聲音"
        ];

        let selectedSubjects = [];
        let classInfo = { grade: 0, classNum: 0 };
        let attendance = { expected: 0, actual: 0 };
        let activeNumpadTarget = null;
        let dashboardIntervals = [];
        let selectedReminders = [...REMINDERS];

        function initSetup() {
            const container = document.getElementById('subjects-container');
            ALL_SUBJECTS.forEach(subject => {
                const btn = document.createElement('button');
                btn.className = 'theme-btn theme-box subject-btn';
                btn.innerText = subject;
                btn.onclick = () => toggleSubject(subject, btn);
                container.appendChild(btn);
            });

            const remContainer = document.getElementById('reminders-container');
            REMINDERS.forEach(rem => {
                const btn = document.createElement('div');
                btn.className = 'reminder-option theme-box selected';
                btn.innerHTML = `<span class="check-icon" style="margin-right:10px; font-size:1.5rem;">✅</span> <span>${rem}</span>`;
                btn.onclick = () => toggleReminder(rem, btn);
                remContainer.appendChild(btn);
            });

            updateStartButtonState();
        }

        // --- 風格切換邏輯 ---
        function setTheme(themeName, btnElement) {
            // 切換 body 的 class
            document.body.className = `theme-${themeName}`;
            
            // 更新按鈕視覺狀態
            document.querySelectorAll('#themes-container .theme-btn').forEach(b => b.classList.remove('selected'));
            btnElement.classList.add('selected');
        }

        function toggleReminder(rem, btnElement) {
            const index = selectedReminders.indexOf(rem);
            const icon = btnElement.querySelector('.check-icon');
            if (index > -1) {
                selectedReminders.splice(index, 1);
                btnElement.classList.remove('selected');
                icon.innerText = '⬜';
            } else {
                selectedReminders.push(rem);
                btnElement.classList.add('selected');
                icon.innerText = '✅';
            }
        }

        function toggleSubject(subject, btnElement) {
            const index = selectedSubjects.indexOf(subject);
            if (index > -1) {
                selectedSubjects.splice(index, 1);
                btnElement.classList.remove('selected');
                const badge = btnElement.querySelector('.order-badge');
                if (badge) badge.remove();
            } else {
                if (selectedSubjects.length >= 4) { alert("考試時間段只有四節，最多只能選擇四個科目！"); return; }
                selectedSubjects.push(subject);
                btnElement.classList.add('selected');
            }
            
            document.querySelectorAll('.subject-btn').forEach(btn => {
                const currentIdx = selectedSubjects.indexOf(btn.childNodes[0].nodeValue.trim());
                const oldBadge = btn.querySelector('.order-badge');
                if (oldBadge) oldBadge.remove();
                if (currentIdx > -1) {
                    const badge = document.createElement('div');
                    badge.className = 'order-badge';
                    badge.innerText = currentIdx + 1;
                    btn.appendChild(badge);
                }
            });
            updateStartButtonState();
        }

        function updateStartButtonState() {
            const btn = document.getElementById('btn-start');
            const hasSubject = selectedSubjects.length > 0;
            const validClass = classInfo.grade > 0 && classInfo.classNum > 0;
            const validExpected = attendance.expected >= 1 && attendance.expected <= 40;
            const validActual = attendance.actual >= 1 && attendance.actual <= 40;
            const validAbsent = attendance.expected >= attendance.actual;
            btn.disabled = !hasSubject || !validClass || !validExpected || !validActual || !validAbsent;
        }

        // --- 數字鍵盤 ---
        function openNumpad(target) {
            activeNumpadTarget = target;
            document.getElementById('numpad-modal').classList.remove('hidden');
            ['expected', 'actual', 'grade', 'classNum'].forEach(id => document.getElementById(`box-${id}`).classList.remove('active'));
            document.getElementById(`box-${target}`).classList.add('active');
        }

        function closeNumpad() {
            document.getElementById('numpad-modal').classList.add('hidden');
            ['expected', 'actual', 'grade', 'classNum'].forEach(id => document.getElementById(`box-${id}`).classList.remove('active'));
            
            if (classInfo.grade > 10) { alert("年級範圍只能設定 1~10"); classInfo.grade = 0; document.getElementById('box-grade').innerText = 0; }
            if (classInfo.classNum > 99) { alert("班級範圍只能設定 1~99"); classInfo.classNum = 0; document.getElementById('box-classNum').innerText = 0; }
            if (activeNumpadTarget === 'expected' && (attendance.expected < 1 || attendance.expected > 40)) {
                alert("應到人數範圍只能設定 1~40"); attendance.expected = 0; document.getElementById('box-expected').innerText = 0;
            }
            if (activeNumpadTarget === 'actual' && (attendance.actual < 1 || attendance.actual > 40)) {
                alert("實到人數範圍只能設定 1~40"); attendance.actual = 0; document.getElementById('box-actual').innerText = 0;
            }
            if (attendance.expected > 0 && attendance.actual > attendance.expected) {
                alert("錯誤：實到人數不可大於應到人數"); attendance.actual = attendance.expected; document.getElementById('box-actual').innerText = attendance.actual;
            }
            document.getElementById('box-absent').innerText = Math.max(0, attendance.expected - attendance.actual);
            updateStartButtonState(); activeNumpadTarget = null;
        }

        function pressNumpad(val) {
            if (!activeNumpadTarget) return;
            let maxLen = (activeNumpadTarget === 'grade' || activeNumpadTarget === 'classNum') ? 2 : 3;
            let targetObj = (activeNumpadTarget === 'grade' || activeNumpadTarget === 'classNum') ? classInfo : attendance;
            
            let currentValStr = targetObj[activeNumpadTarget].toString();
            if (val === 'clear') currentValStr = "0";
            else currentValStr = (currentValStr === "0") ? val.toString() : (currentValStr + val.toString()).substring(0, maxLen);
            
            targetObj[activeNumpadTarget] = parseInt(currentValStr, 10);
            document.getElementById(`box-${activeNumpadTarget}`).innerText = targetObj[activeNumpadTarget];
            document.getElementById('box-absent').innerText = Math.max(0, attendance.expected - attendance.actual);
            updateStartButtonState();
        }

        async function submitToSheetAndStart() {
            const btn = document.getElementById('btn-start'); btn.innerText = "資料上傳中..."; btn.disabled = true;
            const now = new Date(); const dateStr = `${now.getFullYear()}/${now.getMonth()+1}/${now.getDate()}`;
            const currentMins = now.getHours() * 60 + now.getMinutes();
            let currentSubject = "無考試進行中";
            for (let i = 0; i < selectedSubjects.length; i++) {
                if (currentMins >= timeToMins(EXAM_TIMES[i].start) && currentMins <= timeToMins(EXAM_TIMES[i].end)) { currentSubject = selectedSubjects[i]; break; }
            }
            
            const formData = new FormData();
            formData.append("date", dateStr); formData.append("subject", currentSubject);
            formData.append("className", `${classInfo.grade}年${classInfo.classNum}班`);
            formData.append("expected", attendance.expected); formData.append("actual", attendance.actual);
            formData.append("absent", Math.max(0, attendance.expected - attendance.actual));
            formData.append("uploadTime", `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`);

            if (SCRIPT_URL && !SCRIPT_URL.includes("請將這段文字替換為")) {
                try { await fetch(SCRIPT_URL, { method: "POST", body: formData, mode: "no-cors" }); } catch (error) { console.error("上傳失敗", error); }
            }
            btn.innerText = "開始提醒畫面 / 上傳人數"; btn.disabled = false; startDashboard();
        }

        function backToSetup() {
            dashboardIntervals.forEach(clearInterval); dashboardIntervals = [];
            document.getElementById('dashboard-page').classList.add('hidden'); document.getElementById('setup-page').classList.remove('hidden');
        }

        function startDashboard() {
            document.getElementById('setup-page').classList.add('hidden'); document.getElementById('dashboard-page').classList.remove('hidden');
            initDashboard();
        }

        function initDashboard() {
            document.getElementById('display-expected').innerText = attendance.expected;
            document.getElementById('display-actual').innerText = attendance.actual;
            document.getElementById('display-absent').innerText = Math.max(0, attendance.expected - attendance.actual);
            const scheduleData = selectedSubjects.map((subj, index) => ({ subject: subj, start: EXAM_TIMES[index].start, end: EXAM_TIMES[index].end }));
            updateClockAndProgress(scheduleData);
            dashboardIntervals.push(setInterval(() => updateClockAndProgress(scheduleData), 1000));
            startReminders();
        }

        function updateClockAndProgress(schedule) {
            const now = new Date();
            document.getElementById('display-clock').innerText = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}:${String(now.getSeconds()).padStart(2, '0')}`;
            document.getElementById('display-date').innerText = `${now.getFullYear()}/${now.getMonth()+1}/${now.getDate()} (星期${['日', '一', '二', '三', '四', '五', '六'][now.getDay()]})`;

            const currentMins = now.getHours() * 60 + now.getMinutes() + (now.getSeconds() / 60);
            let activeExamIndex = -1, nextExamIndex = -1;
            for (let i = 0; i < schedule.length; i++) {
                if (currentMins >= timeToMins(schedule[i].start) && currentMins <= timeToMins(schedule[i].end)) { activeExamIndex = i; break; }
                else if (currentMins < timeToMins(schedule[i].start) && nextExamIndex === -1) { nextExamIndex = i; }
            }

            const scheduleContainer = document.getElementById('display-schedule');
            if (activeExamIndex !== -1) {
                scheduleContainer.innerHTML = `<div style="font-size: clamp(2rem, 4.5vmin, 5rem); opacity: 0.7;">第 ${activeExamIndex + 1} 節 &nbsp; ${schedule[activeExamIndex].start} - ${schedule[activeExamIndex].end}</div>
                    <div style="font-size: clamp(5rem, 12vmin, 15rem); color: var(--accent-color); font-weight: bold; margin-top: 1vmin; line-height: 1;">${schedule[activeExamIndex].subject}</div>`;
            } else if (nextExamIndex !== -1) {
                scheduleContainer.innerHTML = `<div style="font-size: clamp(2rem, 4.5vmin, 5rem); opacity: 0.7;">下一節 即將開始</div>
                    <div style="font-size: clamp(4rem, 10vmin, 12rem); color: var(--accent-color-2); font-weight: bold; margin-top: 1vmin; line-height: 1;">${schedule[nextExamIndex].subject}</div>`;
            } else {
                scheduleContainer.innerHTML = `<div style="font-size: clamp(3rem, 8vmin, 10rem); opacity: 0.5;">考程已結束</div>`;
            }

            const fill = document.getElementById('progress-fill'), indicator = document.getElementById('progress-indicator');
            const text = document.getElementById('progress-text'), status = document.getElementById('progress-status');

            if (activeExamIndex !== -1) {
                const totalMins = timeToMins(schedule[activeExamIndex].end) - timeToMins(schedule[activeExamIndex].start);
                const percent = Math.min(100, Math.max(0, ((currentMins - timeToMins(schedule[activeExamIndex].start)) / totalMins) * 100));
                
                fill.style.width = `${percent}%`; indicator.style.left = `${percent}%`; indicator.style.display = 'block';
                fill.style.backgroundColor = percent > 80 ? 'var(--progress-warning)' : 'var(--progress-fill)';
                text.innerText = `[${schedule[activeExamIndex].subject}] 進行中`;
                status.innerText = `剩餘 ${Math.ceil(totalMins - (currentMins - timeToMins(schedule[activeExamIndex].start)))} 分鐘`;
                status.style.color = percent > 80 ? 'var(--progress-warning)' : 'var(--accent-color)';
            } else {
                fill.style.width = '0%'; indicator.style.left = '0%';
                if (nextExamIndex !== -1) {
                    indicator.style.display = 'none';
                    text.innerText = nextExamIndex === 0 ? "早修/準備時間" : "下課休息時間";
                    status.innerText = `距下節 ${Math.ceil(timeToMins(schedule[nextExamIndex].start) - currentMins)} 分鐘`;
                    status.style.color = 'var(--accent-color-2)';
                } else {
                    if (schedule.length > 0 && currentMins > timeToMins(schedule[schedule.length-1].end)) {
                        text.innerText = "今日考程已結束"; fill.style.width = '100%'; indicator.style.left = '100%'; indicator.style.display = 'block';
                        fill.style.backgroundColor = 'transparent'; status.innerText = "結束";
                    } else { text.innerText = "等待中..."; status.innerText = "--"; indicator.style.display = 'none'; }
                }
            }
        }

        function startReminders() {
            const displayObj = document.getElementById('display-reminder');
            const activeReminders = selectedReminders.length > 0 ? selectedReminders : ["祝各位考生考試順利！"];
            let currentIndex = 0; displayObj.innerText = activeReminders[currentIndex];
            if (activeReminders.length > 1) {
                dashboardIntervals.push(setInterval(() => {
                    currentIndex = (currentIndex + 1) % activeReminders.length;
                    displayObj.innerText = activeReminders[currentIndex];
                }, 20000));
            }
        }

        function timeToMins(timeStr) { const [h, m] = timeStr.split(':').map(Number); return h * 60 + m; }
        window.onload = initSetup;
    </script>
</body>
</html>
