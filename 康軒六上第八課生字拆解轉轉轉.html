<!doctype html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>康軒六上第八課生字拆解轉轉轉</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Noto Sans TC', 'Microsoft JhengHei', '微軟正黑體', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      color: #333;
      padding: 20px 15px;
      padding-top: 55px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    /* Home Navigation Button */
    .home-btn {
      position: fixed;
      top: 15px;
      right: 15px;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 2px solid rgba(255, 255, 255, 0.7);
      color: #ffffff !important;
      padding: 9px 18px;
      border-radius: 25px;
      text-decoration: none;
      font-weight: 900;
      font-size: 1rem;
      transition: all 0.25s ease;
      z-index: 99999;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.35);
      user-select: none;
    }
    .home-btn:hover {
      background: rgba(0, 0, 0, 0.75);
      border-color: #ffffff;
      transform: translateY(-2px) scale(1.05);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5);
    }

    .game-container {
      max-width: 820px;
      width: 100%;
      background: rgba(255, 255, 255, 0.96);
      border-radius: 24px;
      padding: 30px 35px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.6);
      text-align: center;
    }

    .header {
      margin-bottom: 20px;
    }

    .title {
      font-family: 'ZCOOL KuaiLe', 'Noto Sans TC', sans-serif;
      font-size: 2.4rem;
      color: #2d3748;
      margin-bottom: 12px;
      letter-spacing: 1px;
    }

    .stage-info {
      background: linear-gradient(135deg, #f1f5f9, #e2e8f0);
      padding: 14px 20px;
      border-radius: 14px;
      font-size: 1.15rem;
      font-weight: 700;
      color: #1e293b;
      border: 2px solid #cbd5e1;
      display: inline-block;
      max-width: 95%;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
      transition: all 0.3s ease;
    }

    .stage-info.stage-0 {
      background: linear-gradient(135deg, #eff6ff, #dbeafe);
      border-color: #93c5fd;
      color: #1e40af;
    }
    .stage-info.stage-1 {
      background: linear-gradient(135deg, #fefce8, #fef08a);
      border-color: #fde047;
      color: #854d0e;
    }
    .stage-info.stage-2 {
      background: linear-gradient(135deg, #f0fdf4, #bbf7d0);
      border-color: #86efac;
      color: #166534;
    }
    .stage-info.stage-3 {
      background: linear-gradient(135deg, #fdf2f8, #fbcfe8);
      border-color: #f472b6;
      color: #9d174d;
    }

    .game-area {
      background: #f8fafc;
      border-radius: 20px;
      padding: 30px 20px;
      margin: 22px 0;
      min-height: 270px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 25px;
      flex-wrap: wrap;
      position: relative;
      border: 3px dashed #cbd5e1;
      box-shadow: inset 0 2px 10px rgba(0,0,0,0.04);
      overflow: hidden;
    }

    .component-card {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 110px;
      min-height: 110px;
      padding: 12px 20px;
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.12);
      border: 3px solid #93c5fd;
      font-size: 4.2rem;
      font-weight: 900;
      color: #1e40af;
      font-family: '標楷體', 'DFKai-SB', 'BiauKai', serif;
      cursor: pointer;
      user-select: none;
      transition: transform 0.3s ease, color 0.2s ease, border-color 0.2s ease;
    }

    .component-card:hover {
      transform: scale(1.08);
      border-color: #3b82f6;
      color: #1d4ed8;
      box-shadow: 0 12px 28px rgba(37, 99, 235, 0.25);
    }

    .component-card.merged {
      background: linear-gradient(135deg, #fef3c7, #fde68a);
      border-color: #f59e0b;
      color: #b45309;
      box-shadow: 0 10px 25px rgba(245, 158, 11, 0.3);
      animation: pulseMerge 0.5s ease-out;
    }

    @keyframes pulseMerge {
      0% { transform: scale(0.7); opacity: 0.5; }
      50% { transform: scale(1.15); }
      100% { transform: scale(1); opacity: 1; }
    }

    /* 旋轉動畫 */
    .rotating {
      animation: rotateAnim 3.5s linear infinite;
    }

    @keyframes rotateAnim {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .answer-display {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      animation: celebratePop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes celebratePop {
      0% { transform: scale(0.5); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .answer-char {
      font-size: 7.5rem;
      font-weight: 900;
      color: #15803d;
      font-family: '標楷體', 'DFKai-SB', 'BiauKai', serif;
      line-height: 1.1;
      text-shadow: 2px 4px 10px rgba(21, 128, 61, 0.25);
    }

    .answer-desc {
      font-size: 1.35rem;
      font-weight: 700;
      color: #334155;
      margin-top: 10px;
      padding: 6px 18px;
      background: #dcfce7;
      border-radius: 20px;
      border: 2px solid #86efac;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin: 20px 0 10px;
    }

    .btn {
      border: none;
      padding: 12px 24px;
      font-size: 1.1rem;
      font-weight: 900;
      border-radius: 25px;
      cursor: pointer;
      transition: all 0.25s ease;
      box-shadow: 0 4px 14px rgba(0,0,0,0.15);
      user-select: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: 'Noto Sans TC', sans-serif;
    }

    .btn:hover:not(:disabled) {
      transform: translateY(-2px);
    }

    .btn-nav {
      background: linear-gradient(135deg, #64748b, #475569);
      color: white;
    }
    .btn-nav:hover:not(:disabled) {
      box-shadow: 0 6px 18px rgba(71, 85, 105, 0.4);
    }

    .btn-hint {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: white;
      min-width: 180px;
    }
    .btn-hint:hover:not(:disabled) {
      box-shadow: 0 6px 20px rgba(217, 119, 6, 0.45);
      background: linear-gradient(135deg, #fbbf24, #d97706);
    }

    .btn-next {
      background: linear-gradient(135deg, #10b981, #059669);
      color: white;
    }
    .btn-next:hover:not(:disabled) {
      box-shadow: 0 6px 18px rgba(5, 150, 105, 0.45);
    }

    .btn:disabled {
      background: #cbd5e1 !important;
      color: #94a3b8 !important;
      cursor: not-allowed;
      transform: none !important;
      box-shadow: none !important;
    }}

    .question-counter {
      font-size: 1.15rem;
      font-weight: 900;
      color: #334155;
      padding: 10px 18px;
      background: #f1f5f9;
      border-radius: 20px;
      border: 2px solid #cbd5e1;
      display: inline-block;
    }

    .keyboard-hint {
      margin-top: 14px;
      font-size: 0.92rem;
      color: #64748b;
      font-weight: 600;
    }

    @media (max-width: 600px) {
      .game-container {
        padding: 20px 16px;
      }
      .title {
        font-size: 1.8rem;
      }
      .stage-info {
        font-size: 0.95rem;
        padding: 10px 14px;
      }
      .component-card {
        min-width: 80px;
        min-height: 80px;
        font-size: 3rem;
        padding: 8px 14px;
      }
      .answer-char {
        font-size: 5.5rem;
      }
      .answer-desc {
        font-size: 1.1rem;
      }
      .btn {
        padding: 10px 18px;
        font-size: 0.95rem;
      }
    }
  </style>
</head>
<body>

  <a href="index.html" class="home-btn" onclick="goHome(event)">🏠 回首頁</a>

  <main class="game-container">
    <header class="header">
      <h1 class="title">🧩 康軒六上第八課生字拆解轉轉轉</h1>
      <div class="stage-info stage-0" id="stageInfo">
        初始狀態：部件正在旋轉中，觀察散落的部件，猜猜看是什麼字？
      </div>
    </header>

    <div class="game-area" id="gameArea">
      <!-- 部件卡片由 JS 動態生成 -->
    </div>

    <div class="controls">
      <div class="question-counter" id="questionCounter">
        第 1 題 / 共 19 題
      </div>
      <button class="btn btn-nav" id="prevBtn" onclick="prevQuestion()">⬅️ 上一題</button>
      <button class="btn btn-hint" id="hintBtn" onclick="nextHint()">💡 提示 1 (停止旋轉)</button>
      <button class="btn btn-next" id="nextBtn" onclick="nextQuestion()">下一題 ➡️</button>
    </div>

    <div class="keyboard-hint">
      ⌨️ 快捷鍵：空白鍵 / H (提示) ｜ ← / P (上一題) ｜ → / N / Enter (下一題) ｜ R (重新此題)
    </div>
  </main>

  <script>
    // 回首頁跳轉處理
    function goHome(e) {
      if (e) e.preventDefault();
      let target = 'index.html';
      if (window.location.protocol === 'file:') {
        target = 'index.html';
      } else if (window.location.hostname.includes('github.io')) {
        target = 'https://ai9550.github.io/teacher/';
      }
      try {
        if (window.top && window.top !== window) {
          window.top.location.href = target;
          return;
        }
      } catch (err) {}
      window.location.href = target;
    }

    // 題目資料：設定初始部件(3~4個)、第二階段合併部件(2個)、以及最終答案
    const originalQuestions = [
      {
        answer: '隙',
        meaning: '縫隙、空隙',
        stage0_components: ['阝', '小', '日', '小'],
        stage2_components: ['阝', '𡭝'] // 小+日+小 合併為右半部 𡭝
      },
      {
        answer: '竄',
        meaning: '逃竄、亂竄',
        stage0_components: ['宀', '八', '鼠'],
        stage2_components: ['穴', '鼠'] // 宀+八 合併為 穴
      },
      {
        answer: '旨',
        meaning: '旨意、主旨',
        stage0_components: ['匕', '日'],
        stage2_components: ['匕\n日'] // 上下靠近半拼合
      },
      {
        answer: '悠',
        meaning: '悠閒、悠久',
        stage0_components: ['亻', '攵', '心'],
        stage2_components: ['攸', '心'] // 亻+攵 合併為 攸
      },
      {
        answer: '寓',
        meaning: '寓言、寓意',
        stage0_components: ['宀', '日', '禸'],
        stage2_components: ['宀', '禺'] // 日+禸 合併為 禺
      },
      {
        answer: '鷸',
        meaning: '鷸蚌相爭、鷸鳥',
        stage0_components: ['矛', '冏', '鳥'],
        stage2_components: ['矞', '鳥'] // 矛+冏 合併為 矞
      },
      {
        answer: '狡',
        meaning: '狡猾、狡辯',
        stage0_components: ['犭', '六', '乂'],
        stage2_components: ['犭', '交'] // 六+乂 合併為 交
      },
      {
        answer: '窟',
        meaning: '洞窟、窟窿',
        stage0_components: ['穴', '尸', '出'],
        stage2_components: ['穴', '屈'] // 尸+出 合併為 屈
      },
      {
        answer: '猾',
        meaning: '狡猾、刁猾',
        stage0_components: ['犭', '冎', '月'],
        stage2_components: ['犭', '骨'] // 冎+月 合併為 骨
      },
      {
        answer: '騙',
        meaning: '欺騙、騙子',
        stage0_components: ['馬', '戶', '冊'],
        stage2_components: ['馬', '扁'] // 戶+冊 合併為 扁
      },
      {
        answer: '偽',
        meaning: '偽裝、虛偽',
        stage0_components: ['亻', '爫', '力'],
        stage2_components: ['亻', '為'] // 爫+力 合併為 為
      },
      {
        answer: '誇',
        meaning: '誇大、誇獎',
        stage0_components: ['言', '大', '亏'],
        stage2_components: ['言', '夸'] // 大+亏 合併為 夸
      },
      {
        answer: '辨',
        meaning: '分辨、辨識',
        stage0_components: ['辛', '刂', '辛'],
        stage2_components: ['辛刂', '辛'] // 辛+刂 合併
      },
      {
        answer: '謊',
        meaning: '謊言、說謊',
        stage0_components: ['言', '艹', '巟'],
        stage2_components: ['言', '荒'] // 艹+巟 合併為 荒
      },
      {
        answer: '諷',
        meaning: '諷刺、嘲諷',
        stage0_components: ['言', '几', '風'],
        stage2_components: ['言', '風'] // 几+風 合併為 風
      },
      {
        answer: '惕',
        meaning: '警惕、戒惕',
        stage0_components: ['忄', '日', '勿'],
        stage2_components: ['忄', '易'] // 日+勿 合併為 易
      },
      {
        answer: '察',
        meaning: '觀察、察覺',
        stage0_components: ['宀', '⺼又', '示'],
        stage2_components: ['宀', '祭'] // ⺼又+示 合併為 祭
      },
      {
        answer: '蔽',
        meaning: '隱蔽、遮蔽',
        stage0_components: ['艹', '㡀', '攵'],
        stage2_components: ['艹', '敝'] // 㡀+攵 合併為 敝
      },
      {
        answer: '虛',
        meaning: '虛心、虛張聲勢',
        stage0_components: ['虍', '一', '业'],
        stage2_components: ['虍', '亚'] // 一+业 合併為 亚
      }
    ];

    function shuffleArray(array) {
      const shuffled = [...array];
      for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
      }
      return shuffled;
    }

    const questions = shuffleArray(originalQuestions);

    let currentQuestion = 0;
    let currentStage = 0; // 0: 旋轉中, 1: 停止旋轉, 2: 合併部分部件, 3: 揭曉答案

    // 音效合成 (Web Audio API)
    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function playSound(type) {
      try {
        if (!audioCtx && AudioContextClass) {
          audioCtx = new AudioContextClass();
        }
        if (audioCtx && audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        if (!audioCtx) return;

        const now = audioCtx.currentTime;
        if (type === 'step') {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(450, now);
          osc.frequency.exponentialRampToValueAtTime(750, now + 0.09);
          gain.gain.setValueAtTime(0.25, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now);
          osc.stop(now + 0.1);
        } else if (type === 'merge') {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(520, now);
          osc.frequency.exponentialRampToValueAtTime(900, now + 0.14);
          gain.gain.setValueAtTime(0.28, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.16);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now);
          osc.stop(now + 0.16);
        } else if (type === 'win') {
          const notes = [523.25, 659.25, 783.99, 1046.50];
          notes.forEach((freq, idx) => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, now + idx * 0.09);
            gain.gain.setValueAtTime(0.25, now + idx * 0.09);
            gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.09 + 0.4);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now + idx * 0.09);
            osc.stop(now + idx * 0.09 + 0.4);
          });
        }
      } catch (e) {}
    }

    // 語音發音
    function speakText(text) {
      if ('speechSynthesis' in window) {
        try {
          window.speechSynthesis.cancel();
          const utterance = new SpeechSynthesisUtterance(text);
          utterance.lang = 'zh-TW';
          utterance.rate = 0.85;
          window.speechSynthesis.speak(utterance);
        } catch(e) {}
      }
    }

    function initGame() {
      currentStage = 0;
      updateUI();
    }

    function updateUI() {
      const q = questions[currentQuestion];
      const stageInfo = document.getElementById('stageInfo');
      const hintBtn = document.getElementById('hintBtn');
      const gameArea = document.getElementById('gameArea');
      const counter = document.getElementById('questionCounter');

      counter.textContent = `第 ${currentQuestion + 1} 題 / 共 ${questions.length} 題`;
      stageInfo.className = `stage-info stage-${currentStage}`;
      gameArea.innerHTML = '';

      if (currentStage === 0) {
        // 初始狀態：旋轉中
        stageInfo.textContent = '初始狀態：觀察旋轉中的散落部件，猜猜看是什麼字？';
        hintBtn.textContent = '💡 提示 1 (停止旋轉)';
        hintBtn.disabled = false;

        q.stage0_components.forEach(comp => {
          const card = document.createElement('div');
          card.className = 'component-card rotating';
          card.textContent = comp;
          gameArea.appendChild(card);
        });
      } else if (currentStage === 1) {
        // 第 1 階段提示：停止旋轉
        stageInfo.textContent = '【第一階段提示】部件已停止旋轉！觀察固定正立的部件。';
        hintBtn.textContent = '💡 提示 2 (合併部件)';
        hintBtn.disabled = false;

        q.stage0_components.forEach(comp => {
          const card = document.createElement('div');
          card.className = 'component-card';
          card.textContent = comp;
          gameArea.appendChild(card);
        });
      } else if (currentStage === 2) {
        // 第 2 階段提示：合併其中兩個部件
        stageInfo.textContent = '【第二階段提示】已合併其中兩個部件，字形輪廓越來越清晰了！';
        hintBtn.textContent = '💡 提示 3 (揭曉答案)';
        hintBtn.disabled = false;

        q.stage2_components.forEach(comp => {
          const card = document.createElement('div');
          card.className = 'component-card merged';
          card.style.whiteSpace = 'pre-line';
          card.textContent = comp;
          gameArea.appendChild(card);
        });
      } else if (currentStage === 3) {
        // 第 3 階段提示：完整答案揭曉
        stageInfo.textContent = '【第三階段】🎉 完整答案揭曉！';
        hintBtn.textContent = '🎉 答案已揭曉';
        hintBtn.disabled = true;

        const ansContainer = document.createElement('div');
        ansContainer.className = 'answer-display';
        ansContainer.innerHTML = `
          <div class="answer-char">${q.answer}</div>
          <div class="answer-desc">語詞範例 / 意思：<strong>${q.meaning}</strong></div>
        `;
        gameArea.appendChild(ansContainer);
      }
    }

    function nextHint() {
      if (currentStage < 3) {
        currentStage++;
        if (currentStage === 1) {
          playSound('step');
        } else if (currentStage === 2) {
          playSound('merge');
        } else if (currentStage === 3) {
          playSound('win');
          speakText(questions[currentQuestion].answer + '。' + questions[currentQuestion].meaning);
        }
        updateUI();
      }
    }

    function nextQuestion() {
      currentQuestion = (currentQuestion + 1) % questions.length;
      initGame();
    }

    function prevQuestion() {
      currentQuestion = (currentQuestion - 1 + questions.length) % questions.length;
      initGame();
    }

    // 鍵盤快捷鍵
    document.addEventListener('keydown', function(event) {
      switch(event.key) {
        case ' ':
        case 'h':
        case 'H':
          event.preventDefault();
          if (currentStage < 3) nextHint();
          break;
        case 'r':
        case 'R':
          initGame();
          break;
        case 'ArrowRight':
        case 'n':
        case 'N':
        case 'Enter':
          nextQuestion();
          break;
        case 'ArrowLeft':
        case 'p':
        case 'P':
          prevQuestion();
          break;
      }
    });

    // 啟動初始化
    initGame();
