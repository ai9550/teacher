        radial-gradient(circle at 48.5% 32.5%, transparent 30px, black 32px),
        radial-gradient(circle at 66.75% 25%, transparent 30px, black 32px),
        radial-gradient(circle at 86.5% 32.5%, transparent 30px, black 32px),
        radial-gradient(circle at 12.5% 75%, transparent 30px, black 32px),
        radial-gradient(circle at 30.75% 62.5%, transparent 30px, black 32px),
        radial-gradient(circle at 48.5% 75%, transparent 30px, black 32px),
        radial-gradient(circle at 66.75% 62.5%, transparent 30px, black 32px),
        radial-gradient(circle at 86.5% 75%, transparent 30px, black 32px);
      -webkit-mask-composite: intersect;
      mask-image: 
        radial-gradient(circle at 12.5% 32.5%, transparent 30px, black 32px),
        radial-gradient(circle at 30.75% 25%, transparent 30px, black 32px),
        radial-gradient(circle at 48.5% 32.5%, transparent 30px, black 32px),
        radial-gradient(circle at 66.75% 25%, transparent 30px, black 32px),

        radial-gradient(circle at 66.75% 62.5%, transparent 30px, black 32px),

      cursor: pointer;
      transition: opacity 0.4s ease;

    let currentLessonKey = '1';

    // 音效合成 (Web Audio API)
    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function playSound(type) {
      try {
        if (!audioCtx && AudioContextClass) {
          audioCtx = new AudioContextClass();
        }
        if (audioCtx && audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        if (!audioCtx) return;

        const now = audioCtx.currentTime;
        if (type === 'pop') {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(450, now);
          osc.frequency.exponentialRampToValueAtTime(800, now + 0.08);
          gain.gain.setValueAtTime(0.3, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now);
          osc.stop(now + 0.12);
        } else if (type === 'fanfare') {
          const notes = [523.25, 659.25, 783.99, 1046.50];
          notes.forEach((freq, idx) => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, now + idx * 0.09);
            gain.gain.setValueAtTime(0.25, now + idx * 0.09);
            gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.09 + 0.4);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now + idx * 0.09);
            osc.stop(now + idx * 0.09 + 0.4);
          });
        }
      } catch (e) {}
    }

    // 語音朗讀詞語
    function speakWord(text) {
      if ('speechSynthesis' in window) {
        try {
          window.speechSynthesis.cancel();
          const utterance = new SpeechSynthesisUtterance(text);
          utterance.lang = 'zh-TW';
          utterance.rate = 0.85;
          window.speechSynthesis.speak(utterance);
        } catch(e) {}
      }
    }

    function updateDisplay() {
      const wordElement = document.getElementById('currentWord');
      const currentWord = words[currentWordIndex] || '';
      
      wordElement.textContent = currentWord;
      
      // 依長度調整字級
      wordElement.className = 'word';
      if (currentWord.length === 3) {
        wordElement.classList.add('len-3');
      } else if (currentWord.length === 4) {
        wordElement.classList.add('len-4');
      } else if (currentWord.length === 5) {
        wordElement.classList.add('len-5');
      } else if (currentWord.length === 6) {
        wordElement.classList.add('len-6');
      } else if (currentWord.length > 6) {
        wordElement.classList.add('len-long');
      }
      
      document.getElementById('currentQuestion').textContent = currentWordIndex + 1;
      document.getElementById('totalQuestions').textContent = words.length;
      
      // 更新按鈕狀態
      document.getElementById('prevBtn').disabled = currentWordIndex === 0;
      document.getElementById('nextBtn').disabled = currentWordIndex === words.length - 1;
    }

    function revealWord() {
      const coverCard = document.querySelector('.cover-card');
      if (!coverCard.classList.contains('hidden')) {
        coverCard.classList.add('hidden');
        document.querySelectorAll('.number-circle').forEach(circle => {
          circle.classList.add('hidden');
        });
        playSound('fanfare');
        speakWord(words[currentWordIndex]);
      }
    }

    function removeCircle(number) {
      const circles = document.querySelectorAll('.number-circle');
      if (circles[number - 1] && !circles[number - 1].classList.contains('hidden')) {
        circles[number - 1].classList.add('hidden');
        playSound('pop');
        
        // 檢查是否全部翻開
        const remaining = Array.from(circles).filter(c => !c.classList.contains('hidden'));
        if (remaining.length === 0) {
          revealWord();
        }
      }
    }

    function restartCurrentWord() {
      const coverCard = document.querySelector('.cover-card');
      const circles = document.querySelectorAll('.number-circle');
      
      coverCard.classList.remove('hidden');
      circles.forEach(circle => {
        circle.classList.remove('hidden');
      });
    }

    function nextWord() {
      if (currentWordIndex < words.length - 1) {
        const wordElement = document.getElementById('currentWord');
        wordElement.style.opacity = '0';
        
        currentWordIndex++;
        restartCurrentWord();
        updateDisplay();
        
        setTimeout(() => {
          wordElement.style.opacity = '1';
        }, 200);
      }
    }

    function previousWord() {
      if (currentWordIndex > 0) {
        const wordElement = document.getElementById('currentWord');
        wordElement.style.opacity = '0';
        
        currentWordIndex--;
        restartCurrentWord();
        updateDisplay();
        
        setTimeout(() => {
          wordElement.style.opacity = '1';
        }, 200);
      }
    }

    function switchLesson(lessonKey) {
      currentLessonKey = lessonKey;
      
      document.getElementById('gameTitle').textContent = lessonData[lessonKey].name;
      
      words = [...lessonData[lessonKey].words].sort(() => Math.random() - 0.5);
      currentWordIndex = 0;
      
      document.querySelectorAll('.lesson-btn').forEach(btn => {
        if (btn.dataset.lesson === lessonKey) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      });
      
      restartCurrentWord();
      updateDisplay();
    }

    // 鍵盤快捷鍵
    document.addEventListener('keydown', function(event) {
      switch(event.key) {
        case '1': removeCircle(1); break;
        case '2': removeCircle(2); break;
        case '3': removeCircle(3); break;
        case '4': removeCircle(4); break;
        case '5': removeCircle(5); break;
        case '6': removeCircle(6); break;
        case '7': removeCircle(7); break;
        case '8': removeCircle(8); break;
        case '9': removeCircle(9); break;
        case '0': removeCircle(10); break;
        case 'r':
        case 'R': restartCurrentWord(); break;
        case ' ':
          event.preventDefault();
          revealWord();
          break;
        case 'ArrowLeft':
        case 'p':
        case 'P': previousWord(); break;
        case 'ArrowRight':
        case 'n':
        case 'N':
        case 'Enter': nextWord(); break;
      }
    });

    // 初始化顯示
    updateDisplay();
  </script>
</body>
</html>
