        :root {
            --bingo-grid-size: min(90vw, 520px);
            --ribbon-offset: 25px;
        }
        body {
            font-family: 'Noto Sans TC', 'Microsoft JhengHei', sans-serif;
            background: linear-gradient(135deg, #f0f4f8 0%, #d9e2ec 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            padding: 20px;
            padding-top: 60px;
            position: relative;
            min-height: 100vh;
        }

        /* Home Navigation Button */
        .home-btn {
            position: fixed;
            top: 15px;
            right: 15px;
            background: rgba(30, 41, 59, 0.75);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 2px solid rgba(255, 255, 255, 0.8);
            color: #ffffff !important;
            padding: 9px 18px;
            border-radius: 25px;
            text-decoration: none;
            font-weight: 900;
            font-size: 1rem;
            transition: all 0.25s ease;
            z-index: 99999;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.25);
            user-select: none;
        }
        .home-btn:hover {
            background: rgba(15, 23, 42, 0.95);
            border-color: #ffffff;
            transform: translateY(-2px) scale(1.04);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
        }

        /* Setup Screen Custom Styling */
        .checkbox-container {
            display: block;
            position: relative;
            padding-left: 36px;
            margin-bottom: 12px;
            cursor: pointer;
            font-size: 1.05rem;
            user-select: none;
            color: #334155;
            font-weight: 600;
        }
        .checkbox-container input {
            position: absolute;
            opacity: 0;
            cursor: pointer;
            height: 0;
            width: 0;
        }
        .checkmark {
            position: absolute;
            top: 2px;
            left: 0;
            height: 24px;
            width: 24px;
            background-color: #e2e8f0;
            border-radius: 6px;
            transition: background-color 0.2s;
        }
        .checkbox-container:hover input ~ .checkmark {
            background-color: #cbd5e1;
        }
        .checkbox-container input:checked ~ .checkmark {
            background-color: #2563eb;
        }
        .checkmark:after {
            content: "";
            position: absolute;
            display: none;
        }
        .checkbox-container input:checked ~ .checkmark:after {
            display: block;
        }
        .checkbox-container .checkmark:after {
            left: 8px;
            top: 4px;
            width: 7px;
            height: 12px;
            border: solid white;
            border-width: 0 3px 3px 0;
            transform: rotate(45deg);
        }

        /* Quick Action Buttons in Setup */
        .select-all-btn {
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }

        /* Bingo Card Custom Styling */
        .bingo-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            grid-template-rows: repeat(5, 1fr);
            width: var(--bingo-grid-size);
            height: var(--bingo-grid-size);
            max-width: 520px;
            max-height: 520px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.18);
            border-radius: 1.25rem;
            overflow: hidden;
            background-color: #fff;
            position: relative;
            border: 3px solid #cbd5e1;
        }
        .bingo-cell {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 1px solid #e2e8f0;
            cursor: pointer;
            text-align: center;
            transition: transform 0.25s ease, background-color 0.25s;
            padding: 4px;
            font-weight: bold;
            overflow: hidden;
            flex-shrink: 0; 
            user-select: none;
        }
        .bingo-cell:hover:not(.center-cell) {
            background-color: #f8fafc;
        }
        .cell-content {
            padding: 4px;
            word-break: break-all;
            max-height: 100%;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
        }
        .word {
            font-size: clamp(0.95rem, 3.8vw, 1.6rem);
            color: #1e3a8a;
            font-family: '標楷體', 'DFKai-SB', serif;
            font-weight: 900;
            line-height: 1.15;
        }
        .definition {
            font-size: clamp(0.65rem, 2.2vw, 0.88rem);
            color: #334155;
            line-height: 1.25;
            font-weight: 600;
        }
        .center-cell {
            background: linear-gradient(135deg, #fef3c7, #fde68a);
            color: #b45309;
            font-size: clamp(1.1rem, 3.5vw, 1.6rem);
            font-weight: 900;
        }
        .marked {
            background-color: #fee2e2 !important;
        }
        .heart {
            color: #ef4444;
            font-size: clamp(2rem, 7.5vw, 2.8rem);
            animation: pulse 1s infinite alternate;
        }
        @keyframes pulse {
            from { transform: scale(1); }
            to { transform: scale(1.15); }
        }
        .bingo-line {
            position: absolute;
            background-color: rgba(239, 68, 68, 0.78);
            z-index: 10;
            pointer-events: none;
            border-radius: 9999px;
            animation: fadeIn 0.4s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1); }
        }
        .row-line { height: 8px; width: 100%; left: 0; transform: translateY(-50%); }
        .col-line { width: 8px; height: 100%; top: 0; transform: translateX(-50%); }
        .diag-down-line { height: 8px; width: 141.42%; top: 0; left: 0; transform-origin: top left; transform: rotate(45deg) translateY(-50%); }
        .diag-up-line { height: 8px; width: 141.42%; top: 0; right: 0; transform-origin: top right; transform: rotate(-45deg) translateY(-50%); }

        /* 彩帶效果 */
        .ribbon-effect {
            position: absolute;
            width: 20px;
            height: var(--bingo-grid-size);
            z-index: 9;
            pointer-events: none;
            background-color: transparent;
            border-radius: 0.5rem;
            opacity: 0;
            transition: opacity 0.1s ease-out;
        }
        .ribbon-flash {
            background: linear-gradient(to bottom, #fee2e2, #f87171, #fee2e2);
            opacity: 1;
            animation: ribbonFlash 0.5s linear infinite;
        }
        @keyframes ribbonFlash {
            0%, 100% { box-shadow: 0 0 12px #f87171; opacity: 1; }
            50% { box-shadow: 0 0 24px #ef4444; opacity: 0.8; }
        }

        /* 主持人畫面 */
        .overlay-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(6px);
            z-index: 50;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

            border-radius: 1.5rem;
            max-width: 600px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            text-align: center;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.4);
            display: flex;
            flex-direction: column;
            align-items: center;

    </style>
</head>
<body>

    <a href="index.html" class="home-btn" onclick="goHome(event)">🏠 回首頁</a>

    <h1 id="mainTitle" class="text-3xl sm:text-4xl font-extrabold text-blue-800 mb-6 text-center w-full max-w-xl" style="font-family: 'ZCOOL KuaiLe', 'Noto Sans TC', sans-serif;">

            </div>

        </div>

        <!-- 控制按鈕區 -->

                    window.top.location.href = target;
                    return;

            window.location.href = target;

        // Web Audio API 音效合成
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function playSound(type) {
            try {
                if (!audioCtx && AudioContextClass) {
                    audioCtx = new AudioContextClass();
                }
                if (audioCtx && audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                if (!audioCtx) return;

                const now = audioCtx.currentTime;
                if (type === 'pop') {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(450, now);
                    osc.frequency.exponentialRampToValueAtTime(800, now + 0.08);
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now);
                    osc.stop(now + 0.1);
                } else if (type === 'win') {
                    const notes = [523.25, 659.25, 783.99, 1046.50];
                    notes.forEach((freq, idx) => {
                        const osc = audioCtx.createOscillator();
                        const gain = audioCtx.createGain();
                        osc.type = 'triangle';
                        osc.frequency.setValueAtTime(freq, now + idx * 0.09);
                        gain.gain.setValueAtTime(0.25, now + idx * 0.09);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.09 + 0.4);
                        osc.connect(gain);
                        gain.connect(audioCtx.destination);
                        osc.start(now + idx * 0.09);
                        osc.stop(now + idx * 0.09 + 0.4);
                    });
                }
            } catch (e) {}
        }

                    utterance.rate = 0.85;
                    window.speechSynthesis.speak(utterance);
                } catch(e) {}
            }

            $setupScreen.classList.add('hidden');
            $gameScreen.classList.remove('hidden');
            $gameScreen.classList.add('flex');

            gameState = 'randomizing';
            $btnStartGame.disabled = false;
            $btnRandomize.disabled = false;
            $btnHost.disabled = false;
            $btnStartGame.className = 'px-5 py-3 bg-green-600 hover:bg-green-700 text-white font-bold rounded-xl shadow-md transition duration-150';
            $btnRandomize.className = 'px-5 py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow-md transition duration-150';
            $btnHost.className = 'px-5 py-3 bg-purple-600 hover:bg-purple-700 text-white font-bold rounded-xl shadow-md transition duration-150';

            initializeGrid();
            renderGrid();
            $scoreDisplay.textContent = '請點擊「固定配置」開始遊戲';
        });

        $btnBackToSetup.onclick = () => {
            $gameScreen.classList.add('hidden');
            $gameScreen.classList.remove('flex');
            $setupScreen.classList.remove('hidden');
        };

        // -----------------------------------------------------
        // 4. 遊戲核心邏輯
        // -----------------------------------------------------
        function shuffle(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex !== 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [
                    array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        function initializeGrid() {
            const shuffledWords = shuffle([...ALL_WORDS]).slice(0, 24);
            const gridItems = shuffledWords.map(item => ({
                ...item,
                state: 0, 
                isCenter: false,
                isMarked: false,
            }));

            gridItems.splice(12, 0, { 
                word: 'PASS',
                def: '萬用格',
                state: 2,
                isCenter: true,
                isMarked: true,
            });

            grid = [];
            for (let i = 0; i < 5; i++) {
                grid.push(gridItems.slice(i * 5, (i + 1) * 5));
            }
            lineCount = 0;
            updateScoreDisplay();
        }

        function renderGrid() {
            $bingoGrid.innerHTML = '';
            $bingoGrid.querySelectorAll('.bingo-line').forEach(line => line.remove());

            grid.forEach((row, rowIndex) => {
                row.forEach((cell, colIndex) => {
                    const cellDiv = document.createElement('div');
                    cellDiv.className = 'bingo-cell relative';
                    cellDiv.dataset.row = rowIndex;
                    cellDiv.dataset.col = colIndex;

                    const contentDiv = document.createElement('div');
                    contentDiv.className = 'cell-content';

                    if (cell.isCenter) {
                        cellDiv.classList.add('center-cell', 'marked');
                        contentDiv.innerHTML = cell.word;
                    } else {
                        let innerHTML = '';
                        let contentClass = '';

                        if (cell.state === 0) { // 狀態 0: 語詞
                            innerHTML = `<span class="word">${cell.word}</span>`;
                            contentClass = 'word';
                        } else if (cell.state === 1) { // 狀態 1: 解釋
                            innerHTML = `<span class="definition">${cell.def}</span>`;
                            contentClass = 'definition';
                            cellDiv.classList.add('bg-blue-50');
                        } else if (cell.state === 2) { // 狀態 2: 愛心標記
                            innerHTML = `<i class="fas fa-heart heart"></i>`;
                            contentClass = 'heart';
                            cellDiv.classList.add('marked');
                        }

                        contentDiv.innerHTML = innerHTML;
                        contentDiv.classList.add(contentClass);
                    }

                    cellDiv.appendChild(contentDiv);
                    $bingoGrid.appendChild(cellDiv);

                    if (gameState === 'playing' && !cell.isCenter) {
                        cellDiv.onclick = handleCellClick;
                    }
                });
            });

            if (gameState === 'playing') {
                checkBingo(true); 
                updateSelectedWordsDisplay();
            }
        }

        function handleCellClick(event) {
            if (gameState !== 'playing') return;

            const cellDiv = event.currentTarget;
            const row = parseInt(cellDiv.dataset.row);
            const col = parseInt(cellDiv.dataset.col);
            const cell = grid[row][col];

            if (cell.isCenter) return; 
            
            // 順序切換：0(語詞) -> 1(解釋) -> 2(愛心) -> 0(語詞)
            cell.state = (cell.state + 1) % 3;
            cell.isMarked = (cell.state === 2);
            playSound('pop');
            renderGrid();
        }

        function checkBingo(redraw = false) {
            const lines = []; 
            const BINGO_SIZE = 5;
            const oldLines = lineCount; 

            for (let i = 0; i < BINGO_SIZE; i++) {
                if (grid[i].every(cell => cell.isMarked)) {
                    lines.push({ type: 'row', index: i });
                }
            }

            for (let j = 0; j < BINGO_SIZE; j++) {
                let isBingo = true;
                for (let i = 0; i < BINGO_SIZE; i++) {
                    if (!grid[i][j].isMarked) {
                        isBingo = false;
                        break;
                    }
                }
                if (isBingo) {
                    lines.push({ type: 'col', index: j });
                }
            }

            let diag1Bingo = true;
            for (let i = 0; i < BINGO_SIZE; i++) {
                if (!grid[i][i].isMarked) {
                    diag1Bingo = false;
                    break;
                }
            }
            if (diag1Bingo) lines.push({ type: 'diag', index: 1 });

            let diag2Bingo = true;
            for (let i = 0; i < BINGO_SIZE; i++) {
                if (!grid[i][BINGO_SIZE - 1 - i].isMarked) {
                    diag2Bingo = false;
                    break;
                }
            }
            if (diag2Bingo) lines.push({ type: 'diag', index: 2 });
            
            const newLines = lines.length;

            if (redraw) {
                drawBingoLines(lines);
                lineCount = newLines;
            } else {
                lineCount = newLines;
            }

            updateScoreDisplay();

            if (lineCount > oldLines) {
                showCongrats(); 
                playSound('win'); 
            }
        }

        function drawBingoLines(lines) {
            lines.forEach(line => {
                const lineDiv = document.createElement('div');
                lineDiv.classList.add('bingo-line');
                
                if (line.type === 'row') {
                    lineDiv.classList.add('row-line');
                    lineDiv.style.top = `${line.index * 20 + 10}%`;
                } else if (line.type === 'col') {
                    lineDiv.classList.add('col-line');
                    lineDiv.style.left = `${line.index * 20 + 10}%`;
                } else if (line.type === 'diag') {
                    if (line.index === 1) { 
                        lineDiv.classList.add('diag-down-line');
                    } else if (line.index === 2) { 
                        lineDiv.classList.add('diag-up-line');
                    }
                }
                $bingoGrid.appendChild(lineDiv);
            });
        }

        function updateScoreDisplay() {
            $scoreDisplay.textContent = `🎉 目前連成 ${lineCount} 條線！`;
        }

        function updateSelectedWordsDisplay() {
            const selectedWords = [];
            grid.forEach(row => {
                row.forEach(cell => {
                    if (cell.isMarked && !cell.isCenter) {
                        selectedWords.push(cell.word);
                    }
                });
            });

            const wordsText = selectedWords.length > 0 ? selectedWords.join('、') : '(無)';
            $selectedWordsDisplay.textContent = `已標記語詞: ${wordsText}`;
        }

        function showCongrats() {
            $leftRibbon.classList.add('ribbon-flash');
            $rightRibbon.classList.add('ribbon-flash');
            setTimeout(() => {
                $leftRibbon.classList.remove('ribbon-flash');
                $rightRibbon.classList.remove('ribbon-flash');
            }, 600); 
        }

        // -----------------------------------------------------
        // 5. 按鈕與事件處理
        // -----------------------------------------------------
        $btnRandomize.onclick = () => {
            if ($btnStartGame.disabled || gameState === 'host') return; 
            gameState = 'randomizing';
            initializeGrid();
            renderGrid();
            $scoreDisplay.textContent = '請點擊「固定配置」開始遊戲';
        };

        $btnStartGame.onclick = () => {
            if (gameState === 'host') return;
            if (gameState === 'randomizing' || grid.length === 0) {
                gameState = 'playing';
                renderGrid(); 
                $scoreDisplay.textContent = `目前連成 ${lineCount} 條線`;

                $btnStartGame.disabled = true;
                $btnRandomize.disabled = true;
                $btnHost.disabled = true;
                
                $btnStartGame.classList.add('opacity-50', 'cursor-not-allowed');
                $btnRandomize.classList.add('opacity-50', 'cursor-not-allowed');
                $btnHost.classList.add('opacity-50', 'cursor-not-allowed');
            }
        };

        $btnHost.onclick = () => {
            if ($btnHost.disabled) return; 
            gameState = 'host';
            $hostScreen.style.display = 'flex';
            initializeHostScreen();
        };

        function updateHostRevealedWordsDisplay() {
            const wordsText = drawnWords.map(item => item.word).join('、');
            $hostRevealedWords.textContent = `已出現過的語詞: ${wordsText || '(無)'}`;
        }

        function initializeHostScreen() {
            const currentGridWords = [];
            grid.forEach(row => {
                row.forEach(cell => {
                    if (!cell.isCenter) {
                        currentGridWords.push({ word: cell.word, def: cell.def });
                    }
                });
            });
            availableWords = currentGridWords; 
            drawnWords = [];
            currentDrawnWord = null;
            $currentDef.textContent = '';
            $currentWord.textContent = '?';
            $currentWord.classList.add('hidden');
            $btnRevealWord.disabled = true;
            $btnDrawWord.disabled = false;
            $hostStatus.textContent = '點擊「抽取語詞解釋」開始';
            updateHostRemainingCount();
            updateHostRevealedWordsDisplay(); 
        }

        $btnDrawWord.onclick = () => {
            if (availableWords.length === 0) {
                $hostStatus.textContent = '所有詞彙已抽取完畢！';
                $btnDrawWord.disabled = true;
                $btnRevealWord.disabled = true;
                return;
            }

            const randomIndex = Math.floor(Math.random() * availableWords.length);
            currentDrawnWord = availableWords.splice(randomIndex, 1)[0];

            $currentDef.textContent = currentDrawnWord.def;
            $currentWord.textContent = '?';
            $currentWord.classList.add('hidden');
            $btnRevealWord.disabled = false;
            $hostStatus.textContent = '請根據解釋猜語詞...';
            $btnDrawWord.disabled = true; 

            speakText(currentDrawnWord.def);
            updateHostRemainingCount();
        };

        $btnRevealWord.onclick = () => {
            if (!currentDrawnWord) return;

            $currentWord.textContent = currentDrawnWord.word;
            $currentWord.classList.remove('hidden');
            $hostStatus.textContent = `正確答案是：「${currentDrawnWord.word}」`;
            
            speakText(currentDrawnWord.word);

            if (!drawnWords.some(item => item.word === currentDrawnWord.word && item.def === currentDrawnWord.def)) {
                drawnWords.push(currentDrawnWord);
            }
            updateHostRevealedWordsDisplay(); 

            $btnRevealWord.disabled = true;
            $btnDrawWord.disabled = (availableWords.length === 0);
            currentDrawnWord = null;
        };

        $btnCloseHost.onclick = () => {
            gameState = 'playing'; 
            $hostScreen.style.display = 'none';
            renderGrid(); 
        };

        function updateHostRemainingCount() {
            $hostRemainingCount.textContent = `剩餘詞彙數量：${availableWords.length}`;
        }

        // -----------------------------------------------------
        // 6. 初始啟動
        // -----------------------------------------------------
        initializeSetupScreen();

        window.addEventListener('resize', () => {
            if (gameState === 'playing') {
                checkBingo(true); 
            }
        });

    </script>
</body>
</html>
