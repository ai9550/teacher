  <script>
        class SoundFX {
            constructor() {
                this.ctx = null;
                this.muted = false;
            }

            ensureContext() {
                if (!this.ctx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    if (AudioCtx) {
                        this.ctx = new AudioCtx();
                    }
                }
                if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            playTone(freq, startOffset, duration, type = 'triangle', volume = 0.22) {
                if (this.muted) return;
                this.ensureContext();
                if (!this.ctx) return;

                const now = this.ctx.currentTime + startOffset;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc.type = type;
                osc.frequency.setValueAtTime(freq, now);

                gain.gain.setValueAtTime(0.001, now);
                gain.gain.exponentialRampToValueAtTime(volume, now + 0.015);
                gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

                osc.connect(gain);
                gain.connect(this.ctx.destination);

                osc.start(now);
                osc.stop(now + duration + 0.02);
            }

            playStart() {
                this.playTone(392.0, 0, 0.1, 'triangle', 0.2);
                this.playTone(523.25, 0.09, 0.16, 'triangle', 0.22);
            }

            playCorrect() {
                this.playTone(523.25, 0, 0.1, 'triangle', 0.24);
                this.playTone(659.25, 0.08, 0.1, 'triangle', 0.24);
                this.playTone(783.99, 0.16, 0.2, 'sine', 0.25);
            }

            playWrong() {
                this.playTone(230, 0, 0.12, 'sawtooth', 0.14);
                this.playTone(165, 0.1, 0.18, 'sawtooth', 0.14);
            }

            playWin() {
                this.playTone(523.25, 0, 0.12, 'triangle', 0.24);
                this.playTone(659.25, 0.11, 0.12, 'triangle', 0.24);
                this.playTone(783.99, 0.22, 0.12, 'triangle', 0.24);
                this.playTone(1046.5, 0.34, 0.32, 'sine', 0.28);
            }
        }

                this.timerElement = document.getElementById('timer');
                this.pauseButton = document.getElementById('pauseButton');
                this.restartButton = document.getElementById('restartButton');
                this.startOverlay = document.getElementById('startOverlay');
                this.overlayLessonMsg = document.getElementById('overlayLessonMsg');

                this.soundToggleBtn = document.getElementById('soundToggleBtn');
                this.lessonTitle = document.getElementById('lessonTitle');

                this.activeMoles = new Set();
                this.moleTimers = new Map();

                this.gameEnded = false;

                this.init();

            shuffleArray(array) {
                for (let i = array.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [array[i], array[j]] = [array[j], array[i]];
                }
                return array;
            }

            init() {
                this.holes.forEach((hole, index) => {
                    hole.addEventListener('click', () => this.hitMole(index));
                });

                this.startButton.addEventListener('click', () => {
                    this.startGame();
                });

                this.pauseButton.addEventListener('click', () => {
                    this.togglePause();
                });

                this.restartButton.addEventListener('click', () => {
                    this.prepareLesson(this.currentLesson);
                    this.startGame();
                });

                document.querySelectorAll('.lesson-button').forEach(button => {
                    button.addEventListener('click', () => {
                        const lesson = parseInt(button.dataset.lesson, 10);
                        this.prepareLesson(lesson);
                    });
                });

                document.querySelectorAll('.speed-btn').forEach(button => {
                    button.addEventListener('click', () => {
                        this.setSpeed(button.dataset.speed);
                    });
                });

                this.soundToggleBtn.addEventListener('click', () => {
                    this.sound.muted = !this.sound.muted;
                    this.soundToggleBtn.textContent = this.sound.muted ? '🔇 靜音' : '🔊 音效開';
                    this.soundToggleBtn.classList.toggle('muted', this.sound.muted);
                });

                // 初始進入準備畫面，不自動開始遊戲
                this.prepareLesson(this.currentLesson);
            }

            setSpeed(speed) {
                this.currentSpeed = speed;
                document.querySelectorAll('.speed-btn').forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.speed === speed);
                });
                if (this.isStarted && !this.isPaused && !this.gameEnded) {
                    clearTimeout(this.spawnTimer);
                    this.scheduleNextSpawn();
                }
            }

            clearAllMoles() {
                clearTimeout(this.spawnTimer);
                this.spawnTimer = null;
                this.moleTimers.forEach(t => clearTimeout(t));
                this.moleTimers.clear();
                this.moles.forEach(mole => {
                    mole.classList.remove('active');
                    mole.textContent = '';
                });
                this.activeMoles.clear();
            }

            prepareLesson(lesson) {
                this.isStarted = false;
                this.gameEnded = false;
                this.isPaused = false;
                this.isTransitioning = false;
                clearInterval(this.timerInterval);
                this.timerInterval = null;
                this.clearAllMoles();

                document.querySelectorAll('.lesson-button').forEach(btn => {
                    btn.classList.toggle('active', parseInt(btn.dataset.lesson, 10) === lesson);
                });

                this.currentLesson = lesson;
                const data = this.lessonData[lesson];
                this.allQuestions = data.questions;
                this.questions = this.shuffleArray([...this.allQuestions]);
                this.answerCharacters = data.answers;
                this.distractorCharacters = data.distractors;

                this.score = 0;
                this.currentQuestionIndex = 0;
                this.pausedTime = 0;
                this.startTime = null;

                this.lessonTitle.textContent = data.title;
                this.scoreElement.textContent = '0';
                this.questionElement.textContent = '請按「開始遊戲」挑戰！';
                this.questionNumberElement.textContent = `0/${this.questions.length}`;
                this.timerElement.textContent = '00:00';
                this.pauseButton.textContent = '暫停';
                this.pauseButton.classList.remove('paused');
                this.pauseButton.disabled = true;
                this.restartButton.style.display = 'none';

                this.overlayLessonMsg.textContent = `${data.name}（共 ${this.questions.length} 題）`;
                this.startOverlay.classList.remove('hidden');
            }

            startGame() {
                if (this.isStarted && !this.gameEnded) return;
                this.sound.playStart();

                this.isStarted = true;
                this.gameEnded = false;
                this.isPaused = false;
                this.isTransitioning = false;
                this.score = 0;
                this.currentQuestionIndex = 0;
                this.pausedTime = 0;
                this.questions = this.shuffleArray([...this.allQuestions]);

                this.startOverlay.classList.add('hidden');
                this.restartButton.style.display = 'none';
                this.pauseButton.disabled = false;
                this.pauseButton.textContent = '暫停';
                this.pauseButton.classList.remove('paused');

                this.scoreElement.textContent = '0';
                this.questionElement.textContent = this.questions[0].question;
                this.questionNumberElement.textContent = `1/${this.questions.length}`;

                this.startTime = Date.now();
                clearInterval(this.timerInterval);
                this.timerInterval = setInterval(() => this.updateTimer(), 100);

                setTimeout(() => {
                    if (this.isStarted && !this.isPaused && !this.gameEnded) {
                        this.showRandomMole();
                        this.scheduleNextSpawn();
                    }
                }, 250);
            }

            scheduleNextSpawn() {
                if (!this.isStarted || this.isPaused || this.gameEnded) return;
                const cfg = this.speedConfig[this.currentSpeed];
                const delay = this.getRandomTime(cfg.spawnMin, cfg.spawnMax);
                this.spawnTimer = setTimeout(() => {
                    if (this.isStarted && !this.isPaused && !this.gameEnded) {
                        this.showRandomMole();
                        this.scheduleNextSpawn();
                    }
                }, delay);
            }

            togglePause() {
                if (!this.isStarted || this.gameEnded) return;

                this.isPaused = !this.isPaused;

                if (this.isPaused) {
                    this.pausedTime += Date.now() - this.startTime;
                    this.clearAllMoles();
                    this.pauseButton.textContent = '繼續';
                    this.pauseButton.classList.add('paused');
                } else {
                    this.startTime = Date.now();
                    this.pauseButton.textContent = '暫停';
                    this.pauseButton.classList.remove('paused');
                    this.scheduleNextSpawn();
                }
            }

            updateTimer() {
                if (this.startTime && this.isStarted && !this.gameEnded && !this.isPaused) {
                    const elapsed = (Date.now() - this.startTime) + this.pausedTime;
                    const seconds = Math.floor(elapsed / 1000);
                    const minutes = Math.floor(seconds / 60);
                    const remainingSeconds = seconds % 60;
                    this.timerElement.textContent =
                        `${minutes.toString().padStart(2, '0')}:${remainingSeconds.toString().padStart(2, '0')}`;
                }
            }

            showRandomMole() {
                if (!this.isStarted || this.isPaused || this.gameEnded || this.isTransitioning) return;

                const inactiveHoles = Array.from(this.holes).filter((_, index) => !this.activeMoles.has(index));
                if (inactiveHoles.length === 0) return;

                const randomHole = inactiveHoles[Math.floor(Math.random() * inactiveHoles.length)];
                const holeIndex = parseInt(randomHole.dataset.hole, 10);
                const mole = this.moles[holeIndex];

                let randomCharacter;
                const currentAnswer = this.questions[this.currentQuestionIndex].answer;
                const r = Math.random();

                if (r < 0.58) {
                    randomCharacter = currentAnswer;
                } else if (r < 0.8) {
                    const otherAnswers = this.answerCharacters.filter(ch => ch !== currentAnswer);
                    randomCharacter = otherAnswers[Math.floor(Math.random() * otherAnswers.length)];
                } else {
                    randomCharacter = this.distractorCharacters[Math.floor(Math.random() * this.distractorCharacters.length)];
                }

                mole.textContent = randomCharacter;
                mole.classList.add('active');
                this.activeMoles.add(holeIndex);

                const cfg = this.speedConfig[this.currentSpeed];
                const hideTime = this.getRandomTime(cfg.hideMin, cfg.hideMax);
                const t = setTimeout(() => {
                    mole.classList.remove('active');
                    this.activeMoles.delete(holeIndex);
                    this.moleTimers.delete(holeIndex);
                }, hideTime);
                this.moleTimers.set(holeIndex, t);
            }

            hitMole(holeIndex) {
                if (!this.isStarted || this.gameEnded || this.isPaused || this.isTransitioning) return;
                if (!this.activeMoles.has(holeIndex)) return;

                const mole = this.moles[holeIndex];
                const hole = this.holes[holeIndex];
                const clickedCharacter = mole.textContent;
                const correctAnswer = this.questions[this.currentQuestionIndex].answer;

                if (this.moleTimers.has(holeIndex)) {
                    clearTimeout(this.moleTimers.get(holeIndex));
                    this.moleTimers.delete(holeIndex);
                }
                mole.classList.remove('active');
                this.activeMoles.delete(holeIndex);

                if (clickedCharacter === correctAnswer) {
                    this.sound.playCorrect();
                    this.score += 10;
                    this.scoreElement.textContent = this.score;
                    this.showHitEffect(hole, true);
                    this.isTransitioning = true;

                    setTimeout(() => {
                        this.isTransitioning = false;
                        if (this.isStarted && !this.gameEnded) {
                            this.nextQuestion();
                        }
                    }, 650);
                } else {
                    this.sound.playWrong();
                    this.showHitEffect(hole, false);
                }
            }

            showHitEffect(hole, isCorrect) {
                const effect = document.createElement('div');
                effect.className = isCorrect ? 'hit-effect' : 'hit-effect wrong';
                effect.textContent = isCorrect ? '✓' : '✗';
                hole.appendChild(effect);

                setTimeout(() => {
                    if (effect.parentNode) {
                        effect.parentNode.removeChild(effect);
                    }
                }, 600);
            }

            nextQuestion() {
                this.currentQuestionIndex++;

                if (this.currentQuestionIndex >= this.questions.length) {
                    this.endGame();
                } else {
                    this.questionElement.textContent = this.questions[this.currentQuestionIndex].question;
                    this.questionNumberElement.textContent = `${this.currentQuestionIndex + 1}/${this.questions.length}`;
                }
            }

            endGame() {
                this.gameEnded = true;
                this.isStarted = false;
                clearInterval(this.timerInterval);
                this.timerInterval = null;
                this.clearAllMoles();
                this.sound.playWin();

                const totalPossibleScore = this.questions.length * 10;
                this.questionElement.textContent = `🎉 恭喜完成！總分：${this.score}/${totalPossibleScore}`;
                this.pauseButton.disabled = true;
                this.restartButton.style.display = 'inline-block';
            }

            getRandomTime(min, max) {
                return Math.floor(Math.random() * (max - min + 1)) + min;
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            new WhackAMoleGame();
        });
