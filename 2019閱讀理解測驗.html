<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>2019 閱讀理解測驗</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,"Microsoft JhengHei",sans-serif;background:#eff4fc;color:#20324d}button,select{font:inherit}button{cursor:pointer;touch-action:manipulation}#lock{position:fixed;inset:0;z-index:5;display:grid;place-items:center;background:#edf3ff;padding:20px}.card{background:white;border-radius:22px;padding:30px;box-shadow:0 10px 40px #263e6920;text-align:center;width:min(450px,100%)}h1{color:#2454a5}input,select{border:1px solid #b7c4d7;border-radius:9px;padding:10px;background:white}input{width:100%;font-size:22px}.primary,.grade{border:0;border-radius:12px;background:#2563b4;color:white;padding:14px 20px;font-weight:bold}.primary{width:100%;font-size:20px}#error{height:24px;color:#b42318}#home{position:relative;max-width:850px;margin:50px auto;padding:20px;text-align:center}.grades{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px}.grade{background:white;color:#2454a5;border:2px solid #b7d2fb;font-size:22px;min-height:100px}#reader{display:none}.toolbar{position:sticky;top:0;z-index:3;background:white;display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:10px 16px;box-shadow:0 3px 12px #20324d26}.toolbar label{display:flex;align-items:center;gap:5px;font-size:15px}.toolbar button:disabled{opacity:.45;cursor:default}.toolbar button{border:0;border-radius:8px;padding:10px 12px;background:#dceafb;color:#214a83;font-weight:bold}.toolbar select{max-width:230px}#status{font-size:14px;color:#526987}.pages{padding:16px}.page{position:relative;width:min(100%,900px);margin:0 auto 24px;background:white;box-shadow:0 4px 18px #263e6930}.page img{display:block;width:100%;height:auto}.box{position:absolute;border:2px solid transparent;background:transparent;padding:0}.box:focus-visible,.box.active{border:3px solid #e00000;background:#ff404022;outline:none} .qr{position:absolute;top:0;right:20px;text-align:center;font-size:13px;color:#526987}.qr img{display:block;width:112px;height:112px}.qr small{display:block}@media(max-width:600px){.qr{position:static;display:flex;justify-content:flex-end;align-items:center;gap:10px;margin:0 0 16px auto}.qr img{width:88px;height:88px}#home{margin:20px auto}.toolbar{gap:6px;padding:8px}.toolbar select{max-width:150px}.pages{padding:8px}}
</style></head><body>
<div id="lock"><form class="card" id="form"><div style="font-size:44px">📚</div><h1>2019 閱讀理解測驗</h1><p>請輸入密碼進入測驗</p><input id="password" type="password" inputmode="numeric" placeholder="輸入密碼" required><p id="error" role="alert"></p><button class="primary">進入測驗</button></form></div>
<main id="home"><div class="qr"><img src="reading2019-qr.png" alt="掃描開啟 2019 閱讀理解測驗"><small>平板掃描開啟<br></small></div><h1>2019 閱讀理解測驗</h1><p>請選擇年級，開始語音報讀</p><div class="grades" id="grades"></div><p>選擇年級後，點選試卷上的紅框，就能聆聽框內內容。</p></main>
<section id="reader"><div class="toolbar"><button id="back">← 回到年級選擇</button><strong id="title"></strong><label>語音 <select id="voice"></select></label><label>速度 <select id="speed"><option value="0.6">0.6 倍</option><option value="0.7" selected>0.7 倍</option><option value="0.8">0.8 倍</option><option value="0.9">0.9 倍</option><option value="1">1 倍</option><option value="1.2">1.2 倍</option><option value="1.5">1.5 倍</option></select></label><button id="pause" disabled>暫停</button><button id="resume" disabled>繼續</button><button id="stop" disabled>取消報讀</button><span id="status" aria-live="polite">點選紅框開始報讀</span></div><div class="pages" id="pages"></div></section>
<script>
let EXAM_DATA;
const home=document.querySelector('#home'), reader=document.querySelector('#reader'), pages=document.querySelector('#pages'), status=document.querySelector('#status'), voice=document.querySelector('#voice'); let active=null,session=0,voices=[],paused=false; const pauseButton=document.querySelector('#pause'), resumeButton=document.querySelector('#resume'), stopButton=document.querySelector('#stop'); function updateControls(){pauseButton.disabled=!active||paused;resumeButton.disabled=!active||!paused;stopButton.disabled=!active}
document.querySelector('#form').onsubmit=async e=>{e.preventDefault();const input=document.querySelector('#password'),error=document.querySelector('#error'),button=e.currentTarget.querySelector('button');button.disabled=true;error.textContent='正在開啟題庫，請稍候…';try{const response=await fetch('reading2019.enc');if(!response.ok)throw new Error('load');const bytes=new Uint8Array(await response.arrayBuffer());const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(input.value),'PBKDF2',false,['deriveKey']);const key=await crypto.subtle.deriveKey({name:'PBKDF2',hash:'SHA-256',salt:bytes.slice(0,16),iterations:600000},material,{name:'AES-GCM',length:256},false,['decrypt']);const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:bytes.slice(16,28)},key,bytes.slice(28));EXAM_DATA=JSON.parse(new TextDecoder().decode(plain));document.querySelector('#lock').style.display='none';input.value='';error.textContent=''}catch(err){error.textContent=err.message==='load'?'題庫載入失敗，請檢查網路連線。':'密碼錯誤或題庫無法開啟。'}finally{button.disabled=false}};
function stop(){session++;if(window.speechSynthesis){speechSynthesis.cancel();speechSynthesis.resume()} if(active)active.classList.remove('active');active=null;paused=false;updateControls();status.textContent='點選紅框開始報讀'}
function speak(text,box){stop();if(!voices.length){status.textContent='找不到台灣國語自然語音，請先在裝置安裝或啟用。';return}active=box;box.classList.add('active');updateControls();if(!window.speechSynthesis){status.textContent='此瀏覽器不支援語音報讀';return}let id=session;let chunks=text.match(/[^。！？!?；;]{1,100}[。！？!?；;]?/g)||[text]; let i=0; status.textContent='正在報讀';function next(){if(id!==session)return;if(i>=chunks.length){stop();return}let u=new SpeechSynthesisUtterance(chunks[i++]);u.lang='zh-TW';u.rate=Number(document.querySelector('#speed').value);u.voice=voices.find(v=>v.voiceURI===voice.value)||null;u.onend=next;u.onerror=()=>{if(id===session){stop();status.textContent='語音播放失敗，請確認裝置語音設定。'}};speechSynthesis.speak(u)}next()}
function refreshVoices(){if(!window.speechSynthesis){voice.innerHTML='<option>不支援語音</option>';return}let prev=voice.value;voices=speechSynthesis.getVoices().filter(v=>/^zh[-_]tw$/i.test(v.lang) && /natural|自然/i.test(v.name));voice.replaceChildren();if(!voices.length){voice.add(new Option('此裝置沒有台灣國語自然語音',''));return}for(const v of voices)voice.add(new Option(v.name+' ('+v.lang+')',v.voiceURI));if(voices.some(v=>v.voiceURI===prev))voice.value=prev}
if(window.speechSynthesis){speechSynthesis.onvoiceschanged=refreshVoices;refreshVoices()}
function openGrade(grade){stop();pages.replaceChildren();document.querySelector('#title').textContent=grade+'年級';for(const [index,p] of EXAM_DATA[grade].entries()){let container=document.createElement('div');container.className='page';let img=document.createElement('img');img.src=p.image;img.alt=grade+'年級第 '+(index+1)+' 頁';img.width=p.width;img.height=p.height;container.append(img);for(const [n,b] of p.boxes.entries()){let el=document.createElement('button');el.className='box';el.style.cssText=`left:${b.x}%;top:${b.y}%;width:${b.w}%;height:${b.h}%`;el.setAttribute('aria-label',`第 ${index+1} 頁，第 ${n+1} 個紅框，點擊報讀`);el.onclick=()=>speak(b.text,el);container.append(el)}pages.append(container)}home.style.display='none';reader.style.display='block';window.scrollTo(0,0)}
for(const g of ['二','三','四','五','六']){let b=document.createElement('button');b.className='grade';b.textContent=g+'年級';b.onclick=()=>openGrade(g);document.querySelector('#grades').append(b)}document.querySelector('#back').onclick=()=>{stop();reader.style.display='none';home.style.display='block';pages.replaceChildren();window.scrollTo(0,0)};pauseButton.onclick=()=>{if(!active||paused)return;speechSynthesis.pause();paused=true;updateControls();status.textContent='已暫停報讀'}; resumeButton.onclick=()=>{if(!active||!paused)return;speechSynthesis.resume();paused=false;updateControls();status.textContent='正在報讀'};stopButton.onclick=stop;
</script></body></html>
